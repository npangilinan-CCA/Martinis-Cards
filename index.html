-6\"/><\/svg>\n      <\/button>\n    <\/div>\n    <div class=\"controls\">\n      <button class=\"ctrl-btn\" id=\"shuffleBtn\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5\"/><\/svg>\n        Shuffle category\n      <\/button>\n      <button class=\"ctrl-btn\" id=\"restartBtn\">Restart order<\/button>\n    <\/div>\n    <div class=\"kbd-hint\"><kbd>←<\/kbd> <kbd>→<\/kbd> navigate &nbsp; <kbd>space<\/kbd> flip &nbsp; <kbd>S<\/kbd> shuffle<\/div>\n  <\/div>\n\n  <footer>Source: ISR reviewer — Chapters 1 &amp; 2<\/footer>\n<\/div>\n\n<script>\nconst DATA = [\n {\n  \"chapter\": \"Chapter 1\",\n  \"sections\": [\n   {\n    \"short\": \"Capstone & Background\",\n    \"module\": \"Capstone & Background\",\n    \"terms\": [\n     [\n      \"Capstone project\",\n      \"Undertaking appropriate to a professional field. It should address an existing problem or need. It focuses on business process and the implication of introducing computing solutions in the problem.\"\n     ],\n     [\n      \"Background of the study\",\n      \"Presentation of the importance of the system software, algorithms, processes, or an enterprise resource plan to be designed. Research locale. Follow the inverted pyramid when writing the background of the study. Possible SDGs that can help solve\"\n     ]\n    ]\n   },\n   {\n    \"short\": \"Problem & Objectives\",\n    \"module\": \"Problem & Objectives\",\n    \"terms\": [\n     [\n      \"Statement of the Problem\",\n      \"General statement of the whole problem.\"\n     ],\n     [\n      \"Statement of the Problem guidelines\",\n      \"It should be formulated first. It must be clear and unambiguous. Answer to questions must contribute to the development of the project. Number of specific questions should be enough to cover the problem. 3 to 4 SOP (preferable).\"\n     ],\n     [\n      \"Objectives of the study\",\n      \"Guides the researcher and the reader to know what the proponents. Written by either the beginning with an action or an infinitive.\"\n     ]\n    ]\n   },\n   {\n    \"short\": \"Scope & Significance\",\n    \"module\": \"Scope & Significance\",\n    \"terms\": [\n     [\n      \"Scope\",\n      \"It should include a brief statement of the general purpose of the study, the target period of the study, and the feature of the proposed software.\"\n     ],\n     [\n      \"Delimitation\",\n      \"weakness of the study beyond the control of the researcher.\"\n     ],\n     [\n      \"Significance of the study\",\n      \"Asserts and explain to the reader why the study is vital and essential.\"\n     ]\n    ]\n   },\n   {\n    \"short\": \"Framework\",\n    \"module\": \"Framework\",\n    \"terms\": [\n     [\n      \"Conceptual framework\",\n      \"It presents the relationship between the specific concepts that may be studied.\"\n     ],\n     [\n      \"Input / process / output (agile methodology)\",\n      \"(IPO)\"\n     ]\n    ]\n   }\n  ]\n },\n {\n  \"chapter\": \"Chapter 2\",\n  \"sections\": [\n   {\n    \"module\": \"CHAPTER 2 — RRL and RRS\",\n    \"short\": \"RRL Basics\",\n    \"terms\": [\n     [\n      \"Suggested Chapter 2 structure\",\n      \"Related literature, Related studies, Framework, Synthesis\"\n     ],\n     [\n      \"RRL\",\n      \"Clarifies concepts you need to understand. Show how similar problems have been addressed. Helps identify feature and quality factors. Guides the evaluation approach. Prevents reinventing weak ideas.\"\n     ],\n     [\n      \"Review of Related Literature\",\n      \"Concepts, theories, models, principles, standards, and technical discussions.\"\n     ],\n     [\n      \"Review of related studies\",\n      \"previous research, implemented systems, methods, findings, & lessons.\"\n     ],\n     [\n      \"Literature\",\n      \"ideas and foundations\"\n     ],\n     [\n      \"Studies\",\n      \"prior investigations and implementations.\"\n     ]\n    ]\n   },\n   {\n    \"module\": \"CHAPTER 2 — What Counts as RRL and RRS\",\n    \"short\": \"RRL & RRS Sources\",\n    \"terms\": [\n     [\n      \"What count as RRL\",\n      \"Books, Theory / models, Standards, Technical references, Institutional / Government Resources\"\n     ],\n     [\n      \"Books\",\n      \"Definitions, principles, conceptual foundations\"\n     ],\n     [\n      \"Theory / models\",\n      \"Ways to explain behavior, success, acceptance, usability\"\n     ],\n     [\n      \"Standards\",\n      \"Quality, security, data, or process guidance\"\n     ],\n     [\n      \"Technical references\",\n      \"Architectural concepts, database principles, HCI concepts\"\n     ],\n     [\n      \"Institutional / Government Resources\",\n      \"Policies, official context, service requirements.\"\n     ],\n     [\n      \"What count as RRS\",\n      \"Previous system, Research study, Comparative study, Case study, Evaluation study\"\n     ]\n    ]\n   },\n   {\n    \"module\": \"CHAPTER 2 — Search Strategy\",\n    \"short\": \"Search Strategy\",\n    \"terms\": [\n     [\n      \"Search strategy\",\n      \"do not search the title verbatim. Break the topic into concepts\"\n     ],\n     [\n      \"Keyword decomposition\",\n      \"Problem, Technology, administrator / staff, Process, Information, Evaluation\"\n     ],\n     [\n      \"Where to look credible sources\",\n      \"Peer-reviewed journal, Conference proceedings, University repositories, Government / Institutional publications, Professional standards and official docs, Books and reputable academic text\"\n     ]\n    ]\n   },\n   {\n    \"module\": \"CHAPTER 2 — Screening Sources\",\n    \"short\": \"Screening Sources\",\n    \"terms\": [\n     [\n      \"Screen the sources before you use them\",\n      \"Relevance, Recency, Authority, Method, Evidence, Fit\"\n     ],\n     [\n      \"Relevance\",\n      \"Does it directly support the project concept or context?\"\n     ],\n     [\n      \"Recency\",\n      \"Is the publication current enough for the topic?\"\n     ],\n     [\n      \"Authority\",\n      \"Who published it and is the source credible?\"\n     ],\n     [\n      \"Method\",\n      \"For studies: is the method clear and complete?\"\n     ],\n     [\n      \"Evidence\",\n      \"Are findings supported by data or a clear argument?\"\n     ],\n     [\n      \"Fit\",\n      \"Can you explain why this source matters to your project?\"\n     ]\n    ]\n   },\n   {\n    \"module\": \"CHAPTER 2 — From Summary to Synthesis\",\n    \"short\": \"Summary to Synthesis\",\n    \"terms\": [\n     [\n      \"From Summary to Synthesis\",\n      \"Summarize, Compare, Synthesize\"\n     ],\n     [\n      \"Summarize\",\n      \"(What did the source say?) Capture the relevant idea, method, or finding.\"\n     ],\n     [\n      \"Compare\",\n      \"(How does it relate to other sources?) Look for agreements, differences, methods, and limitations.\"\n     ],\n     [\n      \"Synthesize\",\n      \"(What does the body of evidence imply for your project?) End with the project need or design implication.\"\n     ],\n     [\n      \"Strong rrl\",\n      \"Several studies shows.\"\n     ],\n     [\n      \"Avoid patchwork writing\",\n      \"often looks like copied summaries connected by weak transition\"\n     ]\n    ]\n   },\n   {\n    \"module\": \"CHAPTER 2 — Turn Literature Into Requirements\",\n    \"short\": \"Literature to Requirements\",\n    \"terms\": [\n     [\n      \"Turn literature into requirements\",\n      \"Literature finding, Investigation evidence, Requirement, Evaluation item\"\n     ],\n     [\n      \"Literature finding\",\n      \"users value easy status visibility\"\n     ],\n     [\n      \"Investigation evidence\",\n      \"users repeatedly ask for request status\"\n     ],\n     [\n      \"Requirement\",\n      \"system shall show request status and history.\"\n     ],\n     [\n      \"Evaluation item\",\n      \"users can locate status without assistance.\"\n     ]\n    ]\n   }\n  ]\n }\n];\n\nlet ci = 0;          // current chapter index\nlet si = 0;          // current category index (0 = All)\nlet order = [];\nlet currentIndex = 0;\nlet flipped = false;\nlet mode = 'term';   // 'term' = term shown first, 'def' = definition shown first\n\nconst chapterTabsEl = document.getElementById('chapterTabs');\nconst moduleTabsEl = document.getElementById('moduleTabs');\nconst frontText = document.getElementById('frontText');\nconst backText = document.getElementById('backText');\nconst frontLabel = document.getElementById('frontLabel');\nconst backLabel = document.getElementById('backLabel');\nconst cardEl = document.getElementById('card');\nconst cardPos = document.getElementById('cardPos');\nconst progressFill = document.getElementById('progressFill');\nconst moduleLabel = document.getElementById('moduleLabel');\nconst totalCount = document.getElementById('totalCount');\nconst flipState = document.getElementById('flipState');\n\nfunction chapterCount(c){ return c.sections.reduce((n, s) => n + s.terms.length, 0); }\n\nfunction current(){\n  const ch = DATA[ci];\n  if(si === 0){\n    return { name: 'All', title: 'All categories', terms: ch.sections.flatMap(s => s.terms) };\n  }\n  const s = ch.sections[si - 1];\n  return { name: s.short, title: s.module, terms: s.terms };\n}\n\nfunction buildChapterTabs(){\n  chapterTabsEl.innerHTML = '';\n  DATA.forEach((c, i) => {\n    const btn = document.createElement('button');\n    btn.className = 'chap-btn' + (i === ci ? ' active' : '');\n    btn.innerHTML = c.chapter + '<span class=\"count\">' + chapterCount(c) + '<\/span>';\n    btn.addEventListener('click', () => selectChapter(i));\n    chapterTabsEl.appendChild(btn);\n  });\n}\n\nfunction buildTabs(){\n  moduleTabsEl.innerHTML = '';\n  const ch = DATA[ci];\n  const items = [{ label: 'All', count: chapterCount(ch), title: 'All of ' + ch.chapter }]\n    .concat(ch.sections.map(s => ({ label: s.short, count: s.terms.length, title: s.module })));\n  items.forEach((it, i) => {\n    const btn = document.createElement('button');\n    btn.className = 'mod-btn' + (i === si ? ' active' : '');\n    btn.title = it.title;\n    btn.innerHTML = it.label + '<span class=\"count\">' + it.count + '<\/span>';\n    btn.addEventListener('click', () => selectSub(i));\n    moduleTabsEl.appendChild(btn);\n  });\n}\n\nfunction selectChapter(i){\n  ci = i;\n  selectSub(0);\n}\n\nfunction selectSub(i){\n  si = i;\n  order = current().terms.map((_, k) => k);\n  currentIndex = 0;\n  flipped = false;\n  buildChapterTabs();\n  buildTabs();\n  render();\n}\n\nfunction render(){\n  const cur = current();\n  const [term, def] = cur.terms[order[currentIndex]];\n\n  if(mode === 'term'){\n    frontLabel.textContent = 'TERM';\n    backLabel.textContent = 'DEFINITION';\n    frontText.textContent = term;\n    backText.textContent = def;\n    frontText.className = 'term';\n    backText.className = 'definition';\n  } else {\n    frontLabel.textContent = 'DEFINITION';\n    backLabel.textContent = 'TERM';\n    frontText.textContent = def;\n    backText.textContent = term;\n    frontText.className = 'definition';\n    backText.className = 'term';\n  }\n\n  cardEl.classList.toggle('flipped', flipped);\n  flipState.textContent = flipped ? ('showing ' + (mode === 'term' ? 'definition' : 'term')) : 'tap to flip';\n  cardPos.textContent = (currentIndex + 1) + ' / ' + cur.terms.length;\n  progressFill.style.width = (((currentIndex + 1) / cur.terms.length) * 100) + '%';\n  moduleLabel.textContent = DATA[ci].chapter + ' · ' + cur.name;\n  totalCount.textContent = DATA.reduce((sum, c) => sum + chapterCount(c), 0);\n}\n\nfunction setMode(newMode){\n  mode = newMode;\n  flipped = false;\n  document.querySelectorAll('.mode-opt').forEach(btn => {\n    btn.classList.toggle('active', btn.dataset.mode === newMode);\n  });\n  render();\n}\n\nfunction flip(){\n  flipped = !flipped;\n  cardEl.classList.toggle('flipped', flipped);\n  flipState.textContent = flipped ? ('showing ' + (mode === 'term' ? 'definition' : 'term')) : 'tap to flip';\n}\n\nfunction next(){\n  currentIndex = (currentIndex + 1) % order.length;\n  flipped = false;\n  render();\n}\n\nfunction prev(){\n  currentIndex = (currentIndex - 1 + order.length) % order.length;\n  flipped = false;\n  render();\n}\n\nfunction shuffleModule(){\n  for(let i = order.length - 1; i > 0; i--){\n    const j = Math.floor(Math.random() * (i + 1));\n    [order[i], order[j]] = [order[j], order[i]];\n  }\n  currentIndex = 0;\n  flipped = false;\n  render();\n}\n\nfunction restartOrder(){\n  order = current().terms.map((_, k) => k);\n  currentIndex = 0;\n  flipped = false;\n  render();\n}\n\ndocument.querySelectorAll('.mode-opt').forEach(btn => {\n  btn.addEventListener('click', () => setMode(btn.dataset.mode));\n});\n\ncardEl.addEventListener('click', flip);\ndocument.getElementById('flipBtn').addEventListener('click', flip);\ndocument.getElementById('nextBtn').addEventListener('click', next);\ndocument.getElementById('prevBtn').addEventListener('click', prev);\ndocument.getElementById('shuffleBtn').addEventListener('click', shuffleModule);\ndocument.getElementById('restartBtn').addEventListener('click', restartOrder);\n\ndocument.addEventListener('keydown', (e) => {\n  if(e.code === 'Space'){ e.preventDefault(); flip(); }\n  else if(e.code === 'ArrowRight'){ next(); }\n  else if(e.code === 'ArrowLeft'){ prev(); }\n  else if(e.code === 'KeyS'){ shuffleModule(); }\n});\n\nselectChapter(0);\n<\/script>\n\n<\/body>\n<\/html>\n"}, {"id": "isr-finals", "title": "ISR · Finals 1st Quiz", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ISR Finals 1st Quiz — Flashcard Reviewer<\/title>\n<style>\n  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');\n\n  :root{\n    --bg: #1b130d;\n    --panel: #271b13;\n    --panel-2: #2e2017;\n    --line: #4d382a;\n    --line-soft: #352619;\n    --text: #f4eadf;\n    --muted: #bfa48c;\n    --muted-2: #8c7059;\n    --cyan: #dba46b;\n    --cyan-dim: #94612f;\n    --amber: #e6c08a;\n    --amber-dim: #6b4a24;\n    --card-back: #21160f;\n  }\n\n  *{ box-sizing: border-box; }\n\n  html,body{\n    margin:0; padding:0;\n    background: var(--bg);\n    color: var(--text);\n    font-family: 'Inter', sans-serif;\n    min-height: 100vh;\n  }\n\n  body{\n    background-image:\n      linear-gradient(var(--line-soft) 1px, transparent 1px),\n      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);\n    background-size: 48px 48px;\n    background-position: -1px -1px;\n    background-attachment: fixed;\n  }\n\n  .wrap{\n    max-width: 860px;\n    margin: 0 auto;\n    padding: 36px 20px 80px;\n  }\n\n  header{\n    display:flex;\n    align-items: baseline;\n    justify-content: space-between;\n    gap: 16px;\n    margin-bottom: 28px;\n    flex-wrap: wrap;\n    border-bottom: 1px solid var(--line);\n    padding-bottom: 18px;\n  }\n\n  .brand{\n    display:flex;\n    align-items:baseline;\n    gap: 10px;\n  }\n\n  .brand .dot{\n    width: 9px; height:9px;\n    border-radius: 50%;\n    background: var(--cyan);\n    box-shadow: 0 0 8px var(--cyan);\n    display:inline-block;\n    transform: translateY(-2px);\n  }\n\n  h1{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 20px;\n    font-weight: 600;\n    margin: 0;\n    letter-spacing: 0.2px;\n  }\n\n  .subtitle{\n    font-size: 13px;\n    color: var(--muted);\n    font-family:'IBM Plex Mono', monospace;\n  }\n\n  .stat{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 12.5px;\n    color: var(--muted);\n    text-align: right;\n  }\n\n  .stat b{ color: var(--cyan); font-weight:600; }\n\n  /* module tabs */\n  .modules{\n    display:flex;\n    flex-wrap: wrap;\n    gap: 8px;\n    margin-bottom: 26px;\n  }\n\n  .mod-btn{\n    background: var(--panel);\n    border: 1px solid var(--line);\n    color: var(--muted);\n    font-family: 'IBM Plex Mono', monospace;\n    font-size: 12.5px;\n    padding: 8px 12px;\n    border-radius: 7px;\n    cursor: pointer;\n    transition: border-color .15s ease, color .15s ease, background .15s ease;\n    line-height: 1.3;\n  }\n\n  .mod-btn:hover{ border-color: var(--cyan-dim); color: var(--text); }\n\n  .mod-btn.active{\n    border-color: var(--cyan);\n    color: var(--bg);\n    background: var(--cyan);\n    font-weight: 600;\n  }\n\n  .mod-btn .count{\n    opacity: .65;\n    margin-left: 4px;\n  }\n  .mod-btn.active .count{ opacity:.55; }\n\n  /* front-side mode toggle */\n  .mode-row{\n    display:flex;\n    align-items:center;\n    gap: 10px;\n    margin-bottom: 22px;\n  }\n\n  .mode-label{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 12px;\n    color: var(--muted-2);\n  }\n\n  .mode-toggle{\n    display:inline-flex;\n    background: var(--panel);\n    border: 1px solid var(--line);\n    border-radius: 8px;\n    padding: 3px;\n    gap: 3px;\n  }\n\n  .mode-opt{\n    background: transparent;\n    border: none;\n    color: var(--muted);\n    font-family: 'IBM Plex Mono', monospace;\n    font-size: 12px;\n    padding: 6px 12px;\n    border-radius: 6px;\n    cursor: pointer;\n    transition: background .15s ease, color .15s ease;\n  }\n\n  .mode-opt:hover{ color: var(--text); }\n\n  .mode-opt.active{\n    background: var(--cyan);\n    color: var(--bg);\n    font-weight: 600;\n  }\n\n  /* card area */\n  .stage{\n    display:flex;\n    flex-direction: column;\n    align-items: center;\n    gap: 18px;\n  }\n\n  .progress-row{\n    width: 100%;\n    display:flex;\n    align-items:center;\n    gap: 12px;\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 12px;\n    color: var(--muted-2);\n  }\n\n  .progress-track{\n    flex:1;\n    height: 4px;\n    background: var(--line-soft);\n    border-radius: 4px;\n    overflow: hidden;\n  }\n  .progress-fill{\n    height:100%;\n    background: linear-gradient(90deg, var(--cyan-dim), var(--cyan));\n    width: 0%;\n    transition: width .25s ease;\n  }\n\n  .card-scene{\n    width: 100%;\n    max-width: 640px;\n    perspective: 1400px;\n  }\n\n  .card{\n    position: relative;\n    width: 100%;\n    min-height: 260px;\n    cursor: pointer;\n    transform-style: preserve-3d;\n    transition: transform .45s cubic-bezier(.4,.2,.2,1);\n  }\n\n  .card.flipped{ transform: rotateY(180deg); }\n\n  .face{\n    position:absolute;\n    inset:0;\n    backface-visibility: hidden;\n    border-radius: 12px;\n    border: 1px solid var(--line);\n    padding: 34px 32px;\n    display:flex;\n    flex-direction:column;\n    justify-content:center;\n    align-items:center;\n    text-align:center;\n    gap: 14px;\n  }\n\n  .face-front{\n    background: var(--panel);\n    box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset, 0 18px 40px -20px rgba(0,0,0,.6);\n  }\n\n  .face-back{\n    background: var(--card-back);\n    transform: rotateY(180deg);\n    border-color: var(--cyan-dim);\n  }\n\n  .face-label{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 10.5px;\n    letter-spacing: 1.5px;\n    color: var(--muted-2);\n  }\n\n  .term{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: clamp(19px, 3.4vw, 26px);\n    font-weight: 600;\n    color: var(--cyan);\n    line-height: 1.35;\n  }\n\n  .definition{\n    font-size: 16.5px;\n    line-height: 1.55;\n    color: var(--text);\n    max-width: 480px;\n  }\n\n  .hint{\n    position:absolute;\n    bottom: 14px;\n    font-size: 11px;\n    color: var(--muted-2);\n    font-family:'IBM Plex Mono', monospace;\n  }\n\n  .controls{\n    display:flex;\n    align-items:center;\n    gap: 10px;\n    margin-top: 4px;\n  }\n\n  .ctrl-btn{\n    background: var(--panel);\n    border: 1px solid var(--line);\n    color: var(--text);\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 13px;\n    padding: 10px 16px;\n    border-radius: 8px;\n    cursor: pointer;\n    display:flex;\n    align-items:center;\n    gap: 6px;\n    transition: border-color .15s ease, transform .1s ease;\n  }\n\n  .ctrl-btn:hover{ border-color: var(--cyan-dim); }\n  .ctrl-btn:active{ transform: scale(0.97); }\n\n  .ctrl-btn.primary{\n    background: var(--cyan);\n    color: var(--bg);\n    border-color: var(--cyan);\n    font-weight: 600;\n  }\n  .ctrl-btn.primary:hover{ opacity: .9; }\n\n  .ctrl-btn.ghost{ color: var(--muted); }\n\n  .ctrl-btn svg{ width: 14px; height:14px; }\n\n  .kbd-hint{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 11px;\n    color: var(--muted-2);\n    margin-top: 2px;\n  }\n  .kbd-hint kbd{\n    border: 1px solid var(--line);\n    border-radius: 4px;\n    padding: 1px 5px;\n    font-family: inherit;\n    color: var(--muted);\n  }\n\n  footer{\n    text-align:center;\n    margin-top: 44px;\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 11.5px;\n    color: var(--muted-2);\n  }\n\n  @media (max-width: 520px){\n    .face{ padding: 26px 20px; }\n    header{ flex-direction: column; align-items:flex-start; }\n    .stat{ text-align:left; }\n  }\n\n  @media (prefers-reduced-motion: reduce){\n    .card, .progress-fill{ transition: none; }\n  }\n<\/style>\n<\/head>\n<body>\n\n<div class=\"wrap\">\n\n  <header>\n    <div>\n      <div class=\"brand\"><span class=\"dot\"><\/span><h1>ISR Finals 1st Quiz — Flashcards<\/h1><\/div>\n      <div class=\"subtitle\">BSIS capstone · problem · evidence · research gap · title format<\/div>\n    <\/div>\n    <div class=\"stat\">\n      <div><b id=\"totalCount\">0<\/b> terms loaded<\/div>\n      <div id=\"moduleLabel\">BSIS Capstone Fundamentals<\/div>\n    <\/div>\n  <\/header>\n\n  <div class=\"modules\" id=\"moduleTabs\"><\/div>\n\n  <div class=\"mode-row\">\n    <span class=\"mode-label\">Show first:<\/span>\n    <div class=\"mode-toggle\" id=\"modeToggle\">\n      <button class=\"mode-opt active\" data-mode=\"term\">Term<\/button>\n      <button class=\"mode-opt\" data-mode=\"def\">Definition<\/button>\n    <\/div>\n  <\/div>\n\n  <div class=\"stage\">\n    <div class=\"progress-row\">\n      <span id=\"cardPos\">1 / 6<\/span>\n      <div class=\"progress-track\"><div class=\"progress-fill\" id=\"progressFill\"><\/div><\/div>\n      <span id=\"flipState\">tap to flip<\/span>\n    <\/div>\n\n    <div class=\"card-scene\">\n      <div class=\"card\" id=\"card\">\n        <div class=\"face face-front\">\n          <span class=\"face-label\" id=\"frontLabel\">TERM<\/span>\n          <div class=\"term\" id=\"frontText\"><\/div>\n          <span class=\"hint\">click card / press space<\/span>\n        <\/div>\n        <div class=\"face face-back\">\n          <span class=\"face-label\" id=\"backLabel\" style=\"color:var(--cyan)\">DEFINITION<\/span>\n          <div class=\"definition\" id=\"backText\"><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"controls\">\n      <button class=\"ctrl-btn ghost\" id=\"prevBtn\" title=\"Previous (←)\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M15 18l-6-6 6-6\"/><\/svg>\n        Prev\n      <\/button>\n      <button class=\"ctrl-btn primary\" id=\"flipBtn\">Flip card<\/button>\n      <button class=\"ctrl-btn ghost\" id=\"nextBtn\" title=\"Next (→)\">\n        Next\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M9 18l6-6-6-6\"/><\/svg>\n      <\/button>\n    <\/div>\n    <div class=\"controls\">\n      <button class=\"ctrl-btn\" id=\"shuffleBtn\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5\"/><\/svg>\n        Shuffle module\n      <\/button>\n      <button class=\"ctrl-btn\" id=\"restartBtn\">Restart order<\/button>\n    <\/div>\n    <div class=\"kbd-hint\"><kbd>←<\/kbd> <kbd>→<\/kbd> navigate &nbsp; <kbd>space<\/kbd> flip &nbsp; <kbd>S<\/kbd> shuffle<\/div>\n  <\/div>\n\n  <footer>Source: ISR reviewer — Sections 1–18<\/footer>\n<\/div>\n\n<script>\nconst DATA = [\n {\n  \"module\": \"BSIS Capstone Fundamentals\",\n  \"terms\": [\n   [\n    \"BSIS Capstone\",\n    \"A project focused on improving a real process, decision, service, or information flow through the interaction of business/organization, information, technology, and people.\"\n   ],\n   [\n    \"Business/Organization\",\n    \"The processes, roles, and decisions involved in the organization.\"\n   ],\n   [\n    \"Information\",\n    \"The data, records, and reports used by the organization.\"\n   ],\n   [\n    \"Technology\",\n    \"The systems, databases, and interfaces involved in the project.\"\n   ],\n   [\n    \"People\",\n    \"The users of the system, including concerns about adoption and usability.\"\n   ],\n   [\n    \"The Big Question\",\n    \"How can an information system improve a real process, decision, service, or information flow?\"\n   ]\n  ],\n  \"short\": \"Fundamentals\"\n },\n {\n  \"module\": \"Capstone Logic Chain\",\n  \"terms\": [\n   [\n    \"Capstone Logic Chain\",\n    \"The sequence of Problem, Evidence, Literature, Requirements, System, and Evaluation used to move from identifying a problem toward a proposed system and its assessment.\"\n   ],\n   [\n    \"Problem\",\n    \"Identifies what is not working.\"\n   ],\n   [\n    \"Evidence\",\n    \"Shows how the problem is known or supported.\"\n   ],\n   [\n    \"Literature\",\n    \"Examines what prior research shows.\"\n   ],\n   [\n    \"Requirements\",\n    \"Identifies what the system should do.\"\n   ],\n   [\n    \"System\",\n    \"Identifies what will be built.\"\n   ],\n   [\n    \"Evaluation\",\n    \"Determines how the results will be judged.\"\n   ]\n  ],\n  \"short\": \"Logic Chain\"\n },\n {\n  \"module\": \"Start With a Real Problem\",\n  \"terms\": [\n   [\n    \"Start With a Real Problem\",\n    \"A project is easier to justify when it begins with an observed organizational need.\"\n   ],\n   [\n    \"Real Process\",\n    \"A process may involve manual work, take too long, contain duplicated work, or be difficult to monitor.\"\n   ],\n   [\n    \"Information Need\",\n    \"A need for one reliable flow of data, status, and reports.\"\n   ],\n   [\n    \"Ask Before Building\",\n    \"Identify where work slows down, where information is lost, repeated, or delayed, and what is difficult to see.\"\n   ]\n  ],\n  \"short\": \"Real Problem\"\n },\n {\n  \"module\": \"What Is a Good BSIS Problem?\",\n  \"terms\": [\n   [\n    \"Good BSIS Problem\",\n    \"A strong problem should be observable, specific, documentable, and addressable.\"\n   ],\n   [\n    \"Observable\",\n    \"The problem can be seen in a workflow, record, or user experience.\"\n   ],\n   [\n    \"Specific\",\n    \"The problem has a clear process and context and affects users.\"\n   ],\n   [\n    \"Documentable\",\n    \"The problem can be supported through interviews, observations, or documents.\"\n   ],\n   [\n    \"Addressable\",\n    \"A reasonable information system intervention can improve the problem.\"\n   ]\n  ],\n  \"short\": \"Good Problem\"\n },\n {\n  \"module\": \"Examples of Organizational Problems\",\n  \"terms\": [\n   [\n    \"Organizational Problems\",\n    \"Common organizational problems include issues with records, scheduling, reporting, monitoring, communication, and data quality.\"\n   ],\n   [\n    \"Records\",\n    \"Problems involving paper forms or manually maintained records.\"\n   ],\n   [\n    \"Scheduling\",\n    \"Scheduling that is manually tracked through chats or notebooks.\"\n   ],\n   [\n    \"Reporting\",\n    \"Reporting that involves several spreadsheets and duplicate information.\"\n   ],\n   [\n    \"Monitoring\",\n    \"A situation where stock levels or other information are updated late.\"\n   ],\n   [\n    \"Communication\",\n    \"A situation where users repeatedly ask for the same information.\"\n   ],\n   [\n    \"Data Quality\",\n    \"A situation where different copies of the same record produce inconsistent information.\"\n   ]\n  ],\n  \"short\": \"Problem Examples\"\n },\n {\n  \"module\": \"Weak vs. Strong Starting Point\",\n  \"terms\": [\n   [\n    \"Weak Starting Point\",\n    \"“Build a mobile attendance app.” The problem has been assumed, there is no evidence yet, and the features may be arbitrary.\"\n   ],\n   [\n    \"Strong Starting Point\",\n    \"“Attendance records are manually consolidated, delaying reports and making status checks difficult.” The problem comes first, evidence can be collected, users and processes are visible, and system features can be justified.\"\n   ]\n  ],\n  \"short\": \"Weak vs Strong\"\n },\n {\n  \"module\": \"Preliminary Investigation\",\n  \"terms\": [\n   [\n    \"Preliminary Investigation\",\n    \"Before finalizing the project title, investigate the current situation to understand the existing process and problem.\"\n   ],\n   [\n    \"Interview\",\n    \"Ask users what happens, what causes difficulties, and what they need.\"\n   ],\n   [\n    \"Observation\",\n    \"Watch the actual workflow instead of relying only on how users report that the workflow happens.\"\n   ],\n   [\n    \"Document Review\",\n    \"Examine forms, spreadsheets, reports, policies, and existing records.\"\n   ],\n   [\n    \"Survey\",\n    \"Measure users' perceptions or the frequency of an issue.\"\n   ]\n  ],\n  \"short\": \"Preliminary Investigation\"\n },\n {\n  \"module\": \"Interview: Ask About the Process\",\n  \"terms\": [\n   [\n    \"Interview: Ask About the Process\",\n    \"Good interview questions should be concrete, focused on the process, and open-ended.\"\n   ],\n   [\n    \"Walkthrough Question\",\n    \"“Walk me through the process from start to end.”\"\n   ],\n   [\n    \"Time Question\",\n    \"“Which step takes the most time? Why?”\"\n   ],\n   [\n    \"Information Question\",\n    \"“What information do you usually need?”\"\n   ],\n   [\n    \"Error Question\",\n    \"“Where do errors or duplicate entries happen?”\"\n   ],\n   [\n    \"Improvement Question\",\n    \"“What would make the process easier for you?”\"\n   ],\n   [\n    \"Reporting Question\",\n    \"“What reports do you prepare repeatedly?”\"\n   ]\n  ],\n  \"short\": \"Interview\"\n },\n {\n  \"module\": \"Observation: Watch the Real Workflow\",\n  \"terms\": [\n   [\n    \"Observation: Watch the Real Workflow\",\n    \"Examine the actual sequence of work and look at where time is spent, where information changes hands, and where users create workarounds.\"\n   ],\n   [\n    \"Real Workflow\",\n    \"The workflow can be viewed as Request, Record, Verify, Process, and Report.\"\n   ],\n   [\n    \"Hidden Steps\",\n    \"Less obvious activities in the workflow, such as re-encoding information, waiting for approval, checking multiple files, or manually sending status updates.\"\n   ]\n  ],\n  \"short\": \"Observation\"\n },\n {\n  \"module\": \"Document Review\",\n  \"terms\": [\n   [\n    \"Document Review: The Overlooked Evidence\",\n    \"Documents that can provide evidence include forms, reports, spreadsheets, policies, logs, and templates.\"\n   ]\n  ],\n  \"short\": \"Document Review\"\n },\n {\n  \"module\": \"Survey\",\n  \"terms\": [\n   [\n    \"Survey\",\n    \"A method that is useful when the user base is larger and can help identify quantities or patterns.\"\n   ],\n   [\n    \"Survey Limitation\",\n    \"Surveys should identify quantities or patterns rather than replace investigation of the actual process.\"\n   ]\n  ],\n  \"short\": \"Survey\"\n },\n {\n  \"module\": \"Turning Investigations Into Evidence\",\n  \"terms\": [\n   [\n    \"Turn Investigations into Evidence\",\n    \"Instead of only saying that a process is slow, status is difficult to track, duplicate encoding occurs, or reports take too long, use investigation findings as evidence.\"\n   ],\n   [\n    \"Problem Evidence\",\n    \"Evidence supporting a problem through interview statements, observed delays, and document burdens.\"\n   ],\n   [\n    \"Process Evidence\",\n    \"Evidence about the workflow through workflow maps, handoffs, and repeated steps.\"\n   ],\n   [\n    \"Information Evidence\",\n    \"Evidence involving missing fields, duplicate records, and reporting needs.\"\n   ],\n   [\n    \"User Evidence\",\n    \"Evidence about users' usability needs.\"\n   ]\n  ],\n  \"short\": \"Evidence\"\n },\n {\n  \"module\": \"Building the Problem Statement\",\n  \"terms\": [\n   [\n    \"Build the Problem Statement\",\n    \"A practical problem statement identifies the context, current condition, pain or gap, impact, and need.\"\n   ],\n   [\n    \"Context\",\n    \"Identifies where the problem occurs.\"\n   ],\n   [\n    \"Current Condition\",\n    \"Describes what is happening now.\"\n   ],\n   [\n    \"Pain/Gap\",\n    \"Explains why the current situation is a problem.\"\n   ],\n   [\n    \"Impact\",\n    \"Identifies who or what is affected by the problem.\"\n   ],\n   [\n    \"Need\",\n    \"Identifies what kind of improvement is required.\"\n   ]\n  ],\n  \"short\": \"Problem Statement\"\n },\n {\n  \"module\": \"Defining the Research Gap\",\n  \"terms\": [\n   [\n    \"Defining the Research Gap\",\n    \"A gap is something that is missing, limited, or has not yet been assessed well enough for the specific context.\"\n   ],\n   [\n    \"Research Gap Questions\",\n    \"Ask what the current process fails to provide, what existing practices or solutions do not cover, what local or context-specific need remains, and what the project can reasonably address.\"\n   ],\n   [\n    \"Local Need\",\n    \"A research gap does not necessarily mean that nobody has ever done the same thing; it can involve a need specific to the local context.\"\n   ]\n  ],\n  \"short\": \"Research Gap\"\n },\n {\n  \"module\": \"Common Types of Gap\",\n  \"terms\": [\n   [\n    \"Common Types of Gap\",\n    \"The main types are Process Gap, Information Gap, Integration Gap, Usability Gap, Lack of Evaluation, and Local Implementation Gap.\"\n   ],\n   [\n    \"Process Gap\",\n    \"Problems within the current workflow.\"\n   ],\n   [\n    \"Information Gap\",\n    \"A situation where needed information cannot be accessed.\"\n   ],\n   [\n    \"Integration Gap\",\n    \"A situation involving limited coordination.\"\n   ],\n   [\n    \"Usability Gap\",\n    \"Problems with the usability of an existing system.\"\n   ],\n   [\n    \"Lack of Evaluation\",\n    \"An existing system that has not been evaluated.\"\n   ],\n   [\n    \"Local Implementation Gap\",\n    \"An existing solution that has not been adapted to the local context.\"\n   ]\n  ],\n  \"short\": \"Types of Gap\"\n },\n {\n  \"module\": \"Translate the Problem Into a System Direction\",\n  \"terms\": [\n   [\n    \"Translate the Problem Into a System Direction\",\n    \"Connect the observed problem to a need, requirement, system feature, and alignment.\"\n   ],\n   [\n    \"System Direction Example\",\n    \"For manual request tracking, the need may be centralized status records, the requirement may allow users to submit and monitor requests, and the feature may be a request form with a status dashboard.\"\n   ],\n   [\n    \"Alignment\",\n    \"Every system feature should answer a documented need.\"\n   ]\n  ],\n  \"short\": \"System Direction\"\n },\n {\n  \"module\": \"Keep the Capstone Scope Realistic\",\n  \"terms\": [\n   [\n    \"Keep the Capstone Scope Realistic\",\n    \"Aim for a smaller, well-evaluated system with more depth instead of an oversized project.\"\n   ],\n   [\n    \"Users\",\n    \"Identify who will use the system.\"\n   ],\n   [\n    \"Process\",\n    \"Identify which processes are included in the project.\"\n   ],\n   [\n    \"Data\",\n    \"Identify what information must be stored.\"\n   ],\n   [\n    \"Functions\",\n    \"Identify the essential features the system needs.\"\n   ],\n   [\n    \"Evaluation\",\n    \"Identify what quality attributes will be measured.\"\n   ]\n  ],\n  \"short\": \"Capstone Scope\"\n },\n {\n  \"module\": \"Practical Capstone Title Format\",\n  \"terms\": [\n   [\n    \"A Practical Capstone Title Format\",\n    \"A capstone title can be structured using Development/Design, Type of System, Target Organization/Need, and Purpose/Function.\"\n   ],\n   [\n    \"Title Format Components\",\n    \"Development/Design identifies the development or design, Type of System identifies the system being proposed, Target Organization/Need identifies the organization or need being addressed, and Purpose/Function identifies what the system is intended to do.\"\n   ]\n  ],\n  \"short\": \"Title Format\"\n }\n];\n\nlet currentModule = 0;\nlet order = [];\nlet currentIndex = 0;\nlet flipped = false;\nlet mode = 'term'; // 'term' = term shown first, 'def' = definition shown first\n\nconst moduleTabsEl = document.getElementById('moduleTabs');\nconst frontText = document.getElementById('frontText');\nconst backText = document.getElementById('backText');\nconst frontLabel = document.getElementById('frontLabel');\nconst backLabel = document.getElementById('backLabel');\nconst cardEl = document.getElementById('card');\nconst cardPos = document.getElementById('cardPos');\nconst progressFill = document.getElementById('progressFill');\nconst moduleLabel = document.getElementById('moduleLabel');\nconst totalCount = document.getElementById('totalCount');\nconst flipState = document.getElementById('flipState');\n\nfunction shortModuleLabel(name){\n  return name.split('—')[0].trim();\n}\n\nfunction buildTabs(){\n  moduleTabsEl.innerHTML = '';\n  DATA.forEach((mod, i) => {\n    const btn = document.createElement('button');\n    btn.className = 'mod-btn' + (i === currentModule ? ' active' : '');\n    btn.title = mod.module;\n    btn.innerHTML = mod.short + '<span class=\"count\">' + mod.terms.length + '<\/span>';\n    btn.addEventListener('click', () => selectModule(i));\n    moduleTabsEl.appendChild(btn);\n  });\n}\n\nfunction selectModule(i){\n  currentModule = i;\n  order = DATA[i].terms.map((_, idx) => idx);\n  currentIndex = 0;\n  flipped = false;\n  buildTabs();\n  render();\n}\n\nfunction render(){\n  const mod = DATA[currentModule];\n  const termIndex = order[currentIndex];\n  const [term, def] = mod.terms[termIndex];\n\n  if(mode === 'term'){\n    frontLabel.textContent = 'TERM';\n    backLabel.textContent = 'DEFINITION';\n    frontText.textContent = term;\n    backText.textContent = def;\n    frontText.className = 'term';\n    backText.className = 'definition';\n  } else {\n    frontLabel.textContent = 'DEFINITION';\n    backLabel.textContent = 'TERM';\n    frontText.textContent = def;\n    backText.textContent = term;\n    frontText.className = 'definition';\n    backText.className = 'term';\n  }\n\n  cardEl.classList.toggle('flipped', flipped);\n  flipState.textContent = flipped ? ('showing ' + (mode === 'term' ? 'definition' : 'term')) : 'tap to flip';\n  cardPos.textContent = (currentIndex + 1) + ' / ' + mod.terms.length;\n  progressFill.style.width = (((currentIndex + 1) / mod.terms.length) * 100) + '%';\n  moduleLabel.textContent = mod.module;\n  totalCount.textContent = DATA.reduce((sum, m) => sum + m.terms.length, 0);\n}\n\nfunction setMode(newMode){\n  mode = newMode;\n  flipped = false;\n  document.querySelectorAll('.mode-opt').forEach(btn => {\n    btn.classList.toggle('active', btn.dataset.mode === newMode);\n  });\n  render();\n}\n\nfunction flip(){\n  flipped = !flipped;\n  cardEl.classList.toggle('flipped', flipped);\n  flipState.textContent = flipped ? 'showing definition' : 'tap to flip';\n}\n\nfunction next(){\n  currentIndex = (currentIndex + 1) % order.length;\n  flipped = false;\n  render();\n}\n\nfunction prev(){\n  currentIndex = (currentIndex - 1 + order.length) % order.length;\n  flipped = false;\n  render();\n}\n\nfunction shuffleModule(){\n  for(let i = order.length - 1; i > 0; i--){\n    const j = Math.floor(Math.random() * (i + 1));\n    [order[i], order[j]] = [order[j], order[i]];\n  }\n  currentIndex = 0;\n  flipped = false;\n  render();\n}\n\nfunction restartOrder(){\n  order = DATA[currentModule].terms.map((_, idx) => idx);\n  currentIndex = 0;\n  flipped = false;\n  render();\n}\n\ndocument.querySelectorAll('.mode-opt').forEach(btn => {\n  btn.addEventListener('click', () => setMode(btn.dataset.mode));\n});\n\ncardEl.addEventListener('click', flip);\ndocument.getElementById('flipBtn').addEventListener('click', flip);\ndocument.getElementById('nextBtn').addEventListener('click', next);\ndocument.getElementById('prevBtn').addEventListener('click', prev);\ndocument.getElementById('shuffleBtn').addEventListener('click', shuffleModule);\ndocument.getElementById('restartBtn').addEventListener('click', restartOrder);\n\ndocument.addEventListener('keydown', (e) => {\n  if(e.code === 'Space'){ e.preventDefault(); flip(); }\n  else if(e.code === 'ArrowRight'){ next(); }\n  else if(e.code === 'ArrowLeft'){ prev(); }\n  else if(e.code === 'KeyS'){ shuffleModule(); }\n});\n\nbuildTabs();\nselectModule(0);\n<\/script>\n\n<\/body>\n<\/html>\n"}, {"id": "net2-modules", "title": "NET 2 · Modules 2–7", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>NET 2 — Flashcard Reviewer<\/title>\n<style>\n  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');\n\n  :root{\n    --bg: #0c1712;\n    --panel: #12201a;\n    --panel-2: #16281f;\n    --line: #244535;\n    --line-soft: #1a3327;\n    --text: #e8f3ec;\n    --muted: #8fb6a0;\n    --muted-2: #5a7d6a;\n    --cyan: #6ee89a;\n    --cyan-dim: #2f7a53;\n    --amber: #b7e26e;\n    --amber-dim: #5f7a2f;\n    --card-back: #0e1c15;\n  }\n\n  *{ box-sizing: border-box; }\n\n  html,body{\n    margin:0; padding:0;\n    background: var(--bg);\n    color: var(--text);\n    font-family: 'Inter', sans-serif;\n    min-height: 100vh;\n  }\n\n  body{\n    background-image:\n      linear-gradient(var(--line-soft) 1px, transparent 1px),\n      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);\n    background-size: 48px 48px;\n    background-position: -1px -1px;\n    background-attachment: fixed;\n  }\n\n  .wrap{\n    max-width: 860px;\n    margin: 0 auto;\n    padding: 36px 20px 80px;\n  }\n\n  header{\n    display:flex;\n    align-items: baseline;\n    justify-content: space-between;\n    gap: 16px;\n    margin-bottom: 28px;\n    flex-wrap: wrap;\n    border-bottom: 1px solid var(--line);\n    padding-bottom: 18px;\n  }\n\n  .brand{\n    display:flex;\n    align-items:baseline;\n    gap: 10px;\n  }\n\n  .brand .dot{\n    width: 9px; height:9px;\n    border-radius: 50%;\n    background: var(--cyan);\n    box-shadow: 0 0 8px var(--cyan);\n    display:inline-block;\n    transform: translateY(-2px);\n  }\n\n  h1{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 20px;\n    font-weight: 600;\n    margin: 0;\n    letter-spacing: 0.2px;\n  }\n\n  .subtitle{\n    font-size: 13px;\n    color: var(--muted);\n    font-family:'IBM Plex Mono', monospace;\n  }\n\n  .stat{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 12.5px;\n    color: var(--muted);\n    text-align: right;\n  }\n\n  .stat b{ color: var(--cyan); font-weight:600; }\n\n  /* module tabs */\n  .modules{\n    display:flex;\n    flex-wrap: wrap;\n    gap: 8px;\n    margin-bottom: 26px;\n  }\n\n  .mod-btn{\n    background: var(--panel);\n    border: 1px solid var(--line);\n    color: var(--muted);\n    font-family: 'IBM Plex Mono', monospace;\n    font-size: 12.5px;\n    padding: 8px 12px;\n    border-radius: 7px;\n    cursor: pointer;\n    transition: border-color .15s ease, color .15s ease, background .15s ease;\n    line-height: 1.3;\n  }\n\n  .mod-btn:hover{ border-color: var(--cyan-dim); color: var(--text); }\n\n  .mod-btn.active{\n    border-color: var(--cyan);\n    color: var(--bg);\n    background: var(--cyan);\n    font-weight: 600;\n  }\n\n  .mod-btn .count{\n    opacity: .65;\n    margin-left: 4px;\n  }\n  .mod-btn.active .count{ opacity:.55; }\n\n  /* front-side mode toggle */\n  .mode-row{\n    display:flex;\n    align-items:center;\n    gap: 10px;\n    margin-bottom: 22px;\n  }\n\n  .mode-label{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 12px;\n    color: var(--muted-2);\n  }\n\n  .mode-toggle{\n    display:inline-flex;\n    background: var(--panel);\n    border: 1px solid var(--line);\n    border-radius: 8px;\n    padding: 3px;\n    gap: 3px;\n  }\n\n  .mode-opt{\n    background: transparent;\n    border: none;\n    color: var(--muted);\n    font-family: 'IBM Plex Mono', monospace;\n    font-size: 12px;\n    padding: 6px 12px;\n    border-radius: 6px;\n    cursor: pointer;\n    transition: background .15s ease, color .15s ease;\n  }\n\n  .mode-opt:hover{ color: var(--text); }\n\n  .mode-opt.active{\n    background: var(--cyan);\n    color: var(--bg);\n    font-weight: 600;\n  }\n\n  /* card area */\n  .stage{\n    display:flex;\n    flex-direction: column;\n    align-items: center;\n    gap: 18px;\n  }\n\n  .progress-row{\n    width: 100%;\n    display:flex;\n    align-items:center;\n    gap: 12px;\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 12px;\n    color: var(--muted-2);\n  }\n\n  .progress-track{\n    flex:1;\n    height: 4px;\n    background: var(--line-soft);\n    border-radius: 4px;\n    overflow: hidden;\n  }\n  .progress-fill{\n    height:100%;\n    background: linear-gradient(90deg, var(--cyan-dim), var(--cyan));\n    width: 0%;\n    transition: width .25s ease;\n  }\n\n  .card-scene{\n    width: 100%;\n    max-width: 640px;\n    perspective: 1400px;\n  }\n\n  .card{\n    position: relative;\n    width: 100%;\n    min-height: 260px;\n    cursor: pointer;\n    transform-style: preserve-3d;\n    transition: transform .45s cubic-bezier(.4,.2,.2,1);\n  }\n\n  .card.flipped{ transform: rotateY(180deg); }\n\n  .face{\n    position:absolute;\n    inset:0;\n    backface-visibility: hidden;\n    border-radius: 12px;\n    border: 1px solid var(--line);\n    padding: 34px 32px;\n    display:flex;\n    flex-direction:column;\n    justify-content:center;\n    align-items:center;\n    text-align:center;\n    gap: 14px;\n  }\n\n  .face-front{\n    background: var(--panel);\n    box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset, 0 18px 40px -20px rgba(0,0,0,.6);\n  }\n\n  .face-back{\n    background: var(--card-back);\n    transform: rotateY(180deg);\n    border-color: var(--cyan-dim);\n  }\n\n  .face-label{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 10.5px;\n    letter-spacing: 1.5px;\n    color: var(--muted-2);\n  }\n\n  .term{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: clamp(19px, 3.4vw, 26px);\n    font-weight: 600;\n    color: var(--cyan);\n    line-height: 1.35;\n  }\n\n  .definition{\n    font-size: 16.5px;\n    line-height: 1.55;\n    color: var(--text);\n    max-width: 480px;\n  }\n\n  .hint{\n    position:absolute;\n    bottom: 14px;\n    font-size: 11px;\n    color: var(--muted-2);\n    font-family:'IBM Plex Mono', monospace;\n  }\n\n  .controls{\n    display:flex;\n    align-items:center;\n    gap: 10px;\n    margin-top: 4px;\n  }\n\n  .ctrl-btn{\n    background: var(--panel);\n    border: 1px solid var(--line);\n    color: var(--text);\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 13px;\n    padding: 10px 16px;\n    border-radius: 8px;\n    cursor: pointer;\n    display:flex;\n    align-items:center;\n    gap: 6px;\n    transition: border-color .15s ease, transform .1s ease;\n  }\n\n  .ctrl-btn:hover{ border-color: var(--cyan-dim); }\n  .ctrl-btn:active{ transform: scale(0.97); }\n\n  .ctrl-btn.primary{\n    background: var(--cyan);\n    color: var(--bg);\n    border-color: var(--cyan);\n e\">\n      <div class=\"card\" id=\"card\">\n        <div class=\"face face-front\">\n          <span class=\"face-label\" id=\"frontLabel\">TERM<\/span>\n          <div class=\"term\" id=\"frontText\"><\/div>\n          <span class=\"hint\">click card / press space<\/span>\n        <\/div>\n        <div class=\"face face-back\">\n          <span class=\"face-label\" id=\"backLabel\" style=\"color:var(--cyan)\">DEFINITION<\/span>\n          <div class=\"definition\" id=\"backText\"><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"controls\">\n      <button class=\"ctrl-btn ghost\" id=\"prevBtn\" title=\"Previous (←)\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M15 18l-6-6 6-6\"/><\/svg>\n        Prev\n      <\/button>\n      <button class=\"ctrl-btn primary\" id=\"flipBtn\">Flip card<\/button>\n      <button class=\"ctrl-btn ghost\" id=\"nextBtn\" title=\"Next (→)\">\n        Next\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M9 18l6-6-6-6\"/><\/svg>\n      <\/button>\n    <\/div>\n    <div class=\"controls\">\n      <button class=\"ctrl-btn\" id=\"shuffleBtn\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5\"/><\/svg>\n        Shuffle module\n      <\/button>\n      <button class=\"ctrl-btn\" id=\"restartBtn\">Restart order<\/button>\n    <\/div>\n    <div class=\"kbd-hint\"><kbd>←<\/kbd> <kbd>→<\/kbd> navigate &nbsp; <kbd>space<\/kbd> flip &nbsp; <kbd>S<\/kbd> shuffle<\/div>\n  <\/div>\n\n  <footer>Source: NET 2 flashcard set — Modules 2–7<\/footer>\n<\/div>\n\n<script>\nconst DATA = [\n {\n  \"module\": \"MODULE 2 — SWITCHING CONCEPTS\",\n  \"short\": \"Module 2\",\n  \"terms\": [\n   [\n    \"INGRESS\",\n    \"Entering an interface.\"\n   ],\n   [\n    \"EGRESS\",\n    \"Exiting an interface.\"\n   ],\n   [\n    \"MAC ADDRESS TABLE\",\n    \"A table a switch builds by recording the source MAC address along with the port on which it was received.\"\n   ],\n   [\n    \"CAM TABLE\",\n    \"Another name for the switch MAC address table.\"\n   ],\n   [\n    \"LEARN\",\n    \"The switching process where the switch examines the source address, adds the source MAC if it is not in the table, and resets the timeout to 5 minutes if it is already present.\"\n   ],\n   [\n    \"FORWARD\",\n    \"The switching process where the switch examines the destination address and sends the frame through the specified port if the destination MAC is in the MAC address table.\"\n   ],\n   [\n    \"FLOODING\",\n    \"The process of sending a frame out all interfaces except the interface on which it was received when the destination MAC address is not in the MAC address table.\"\n   ],\n   [\n    \"ASIC\",\n    \"Application-Specific Integrated Circuit used by switches to make very quick forwarding decisions.\"\n   ],\n   [\n    \"STORE-AND-FORWARD SWITCHING\",\n    \"A switching method that receives the entire frame and checks whether the frame is valid before forwarding it.\"\n   ],\n   [\n    \"FCS\",\n    \"Frame Check Sequence used to check a frame for CRC errors.\"\n   ],\n   [\n    \"BUFFERING\",\n    \"Temporarily storing a frame on the ingress interface while the switch checks the FCS and adjusts for possible differences in port speeds.\"\n   ],\n   [\n    \"CUT-THROUGH SWITCHING\",\n    \"A switching method that forwards a frame immediately after determining its destination MAC address and egress port.\"\n   ],\n   [\n    \"FRAGMENT-FREE\",\n    \"A cut-through method that checks the destination and ensures the frame is at least 64 bytes to eliminate runts.\"\n   ],\n   [\n    \"COLLISION DOMAIN\",\n    \"A network area where collisions can occur; switches eliminate these domains and reduce congestion.\"\n   ],\n   [\n    \"AUTO-NEGOTIATION\",\n    \"A feature used to automatically negotiate duplex and speed settings.\"\n   ],\n   [\n    \"BROADCAST DOMAIN\",\n    \"A network area extending across all Layer 1 or Layer 2 devices on a LAN.\"\n   ],\n   [\n    \"ROUTER\",\n    \"A Layer 3 device that breaks a broadcast domain.\"\n   ],\n   [\n    \"FULL-DUPLEX\",\n    \"A communication mode used with the MAC address table to eliminate collisions and avoid congestion.\"\n   ]\n  ]\n },\n {\n  \"module\": \"MODULE 3 — VLANs\",\n  \"short\": \"Module 3\",\n  \"terms\": [\n   [\n    \"VLAN\",\n    \"A logical connection that groups similar devices and provides segmentation and organization within a switched network.\"\n   ],\n   [\n    \"VLAN SEGMENTATION\",\n    \"The process of placing devices into different VLANs to separate groups of devices on the same switches.\"\n   ],\n   [\n    \"VLAN 1\",\n    \"The default VLAN, default Native VLAN, and default Management VLAN that cannot be deleted or renamed.\"\n   ],\n   [\n    \"DATA VLAN\",\n    \"A VLAN dedicated to user-generated traffic such as email and web traffic.\"\n   ],\n   [\n    \"NATIVE VLAN\",\n    \"A VLAN used for trunk links where frames are not tagged on an 802.1Q trunk link.\"\n   ],\n   [\n    \"MANAGEMENT VLAN\",\n    \"A VLAN used for SSH/Telnet VTY traffic and typically used as the SVI for a Layer 2 switch.\"\n   ],\n   [\n    \"VOICE VLAN\",\n    \"A separate VLAN for voice traffic that requires assured bandwidth, high QoS priority, congestion avoidance, and less than 150 ms delay from source to destination.\"\n   ],\n   [\n    \"TRUNK\",\n    \"A point-to-point link between two network devices that allows more than one VLAN to pass through.\"\n   ],\n   [\n    \"TRUNK FUNCTIONS\",\n    \"Allowing multiple VLANs, extending VLANs across the network, supporting all VLANs by default, and supporting 802.1Q trunking.\"\n   ],\n   [\n    \"802.1Q\",\n    \"A trunking standard that uses a 4-byte VLAN tag in the frame.\"\n   ],\n   [\n    \"802.1Q TAG\",\n    \"A 4-byte header added to identify the VLAN of a frame.\"\n   ],\n   [\n    \"FCS RECALCULATION\",\n    \"The process of recalculating the Frame Check Sequence after a VLAN tag is added or removed.\"\n   ],\n   [\n    \"NATIVE VLAN TAGGING\",\n    \"The process in which frames on the native VLAN are not tagged while other VLANs are typically tagged on an 802.1Q trunk.\"\n   ],\n   [\n    \"CDP\",\n    \"A protocol used by the switch to inform a VoIP phone of the Voice VLAN.\"\n   ],\n   [\n    \"CoS\",\n    \"Cost of Service, used by a VoIP phone to mark voice traffic and provide Layer 2 QoS.\"\n   ]\n  ]\n },\n {\n  \"module\": \"MODULE 4 — VLAN AND INTER-VLAN ROUTING\",\n  \"short\": \"Module 4\",\n  \"terms\": [\n   [\n    \"VLAN PURPOSE\",\n    \"Logically dividing a single physical switch or network into multiple isolated virtual networks regardless of the physical location of devices.\"\n   ],\n   [\n    \"BROADCAST DOMAIN CONTAINMENT\",\n    \"Using VLANs to divide a physical switch into smaller broadcast domains, reducing congestion and freeing bandwidth.\"\n   ],\n   [\n    \"LAYER 2 SECURITY\",\n    \"Isolating devices in different VLANs so they cannot communicate directly, helping prevent unauthorized access and limit malware spread.\"\n   ],\n   [\n    \"COST SAVINGS\",\n    \"Using shared switch hardware for separate logical networks instead of purchasing dedicated physical switches for each department.\"\n   ],\n   [\n    \"FLEXIBLE ADMINISTRATION\",\n    \"Grouping users by project, department, or security requirements rather than by their physical desk location.\"\n   ],\n   [\n    \"INTER-VLAN ROUTING\",\n    \"Enabling communication between devices assigned to different VLANs while maintaining VLAN security, broadcast control, and network isolation.\"\n   ],\n   [\n    \"CROSS-SUBNET COMMUNICATION\",\n    \"Communication between different VLAN subnets using a Layer 3 device to forward IP packets between them.\"\n   ],\n   [\n    \"LAYER 3 DEVICE\",\n    \"A device that forwards IP packets between different VLANs or subnets.\"\n   ],\n   [\n    \"SHARED RESOURCE ACCESS\",\n    \"Allowing isolated VLANs such as Finance, Engineering, or Guest Wi-Fi to selectively access shared resources such as databases, printers, or internet gateways.\"\n   ],\n   [\n    \"BROADCAST CONTAINMENT\",\n    \"Keeping broadcast traffic such as ARP requests confined within individual VLANs to prevent unnecessary network congestion.\"\n   ]\n  ]\n },\n {\n  \"module\": \"MODULE 5 — SPANNING TREE PROTOCOL\",\n  \"short\": \"Module 5\",\n  \"terms\": [\n   [\n    \"STP\",\n    \"Spanning Tree Protocol, which prevents network loops when switches have redundant links.\"\n   ],\n   [\n    \"NETWORK LOOP\",\n    \"A condition where traffic can circulate continuously through redundant switch links, causing broadcast storms, constantly changing MAC tables, and duplicate frames.\"\n   ],\n   [\n    \"BLOCKED PORT\",\n    \"An STP port that prevents traffic from continuously circulating through a network loop.\"\n   ],\n   [\n    \"STP 802.1D\",\n    \"The original version of Spanning Tree Protocol.\"\n   ],\n   [\n    \"PVST+\",\n    \"Cisco's version of STP that provides a separate spanning tree for each VLAN and is Cisco's default.\"\n   ],\n   [\n    \"RSTP 802.1W\",\n    \"Rapid Spanning Tree Protocol, which provides much faster convergence than traditional STP.\"\n   ],\n   [\n    \"RAPID PVST+\",\n    \"A version combining RSTP with per-VLAN spanning tree support.\"\n   ],\n   [\n    \"ROOT BRIDGE\",\n    \"The reference-point switch for the entire STP network.\"\n   ],\n   [\n    \"ROOT PORT\",\n    \"The port on a non-root switch that provides the best path back to the root bridge.\"\n   ],\n   [\n    \"DESIGNATED PORT\",\n    \"The port providing the best route to the root bridge for a given network link.\"\n   ],\n   [\n    \"NON-DESIGNATED PORT\",\n    \"A port that is not selected as a root or designated port and therefore remains blocked.\"\n   ],\n   [\n    \"BPDUs\",\n    \"Bridge Protocol Data Units sent by switches to advertise their Root Cost and Bridge ID.\"\n   ],\n   [\n    \"BID\",\n    \"Bridge ID, consisting of the STP priority and the switch's MAC address.\"\n   ],\n   [\n    \"STP PRIORITY\",\n    \"The priority value used as part of the Bridge ID; the default is 32768.\"\n   ],\n   [\n    \"ROOT COST\",\n    \"The cost of a path toward the root bridge.\"\n   ],\n   [\n    \"PORT COST\",\n    \"A value used to determine the best path toward the root bridge, with lower-speed links having higher costs.\"\n   ],\n   [\n    \"CONVERGENCE\",\n    \"The amount of time required for the network to stabilize after a change.\"\n   ],\n   [\n    \"HELLO TIMER\",\n    \"The default 2-second STP timer used for the \\\"I'm still alive\\\" message.\"\n   ],\n   [\n    \"MAX AGE\",\n    \"The default 20-second STP timer that determines how long to wait before assuming a switch is down.\"\n   ],\n   [\n    \"FORWARD DELAY\",\n    \"The default 15-second timer that determines how long a port stays in Listening and Learning before Forwarding.\"\n   ],\n   [\n    \"LISTENING\",\n    \"An STP state that occurs before a port enters the Learning state.\"\n   ],\n   [\n    \"LEARNING\",\n    \"An STP state that occurs before a port enters the Forwarding state.\"\n   ],\n   [\n    \"FORWARDING\",\n    \"An STP state in which the port is allowed to forward traffic.\"\n   ]\n  ]\n },\n {\n  \"module\": \"MODULE 6 — ETHERCHANNEL\",\n  \"short\": \"Module 6\",\n  \"terms\": [\n   [\n    \"LINK AGGREGATION\",\n    \"A technology that combines multiple physical links into a single logical link.\"\n   ],\n   [\n    \"ETHERCHANNEL\",\n    \"A link aggregation technology that groups multiple physical Ethernet links into one logical link to provide fault tolerance, load sharing, increased bandwidth, and redundancy.\"\n   ],\n   [\n    \"PORT CHANNEL\",\n    \"The virtual or logical interface created when physical interfaces are bundled into an EtherChannel.\"\n   ],\n   [\n    \"FAULT TOLERANCE\",\n    \"The ability of EtherChannel to continue operating when one physical link within the channel fails.\"\n   ],\n   [\n    \"LOAD BALANCING\",\n    \"Distributing traffic between links that are part of the same EtherChannel.\"\n   ],\n   [\n    \"REDUNDANCY\",\n    \"Providing multiple physical links within one logical connection so the connection can continue if one link fails.\"\n   ],\n   [\n    \"ETHERCHANNEL RESTRICTION\",\n    \"EtherChannel interfaces must use compatible interface types, and each EtherChannel can consist of up to eight compatibly configured Ethernet ports.\"\n   ],\n   [\n    \"PAgP\",\n    \"Port Aggregation Protocol, a Cisco-proprietary protocol used to automatically create EtherChannel links through negotiation.\"\n   ],\n   [\n    \"LACP\",\n    \"Link Aggregation Control Protocol, an IEEE 802.3ad standard that allows multiple physical ports to be bundled into one logical channel.\"\n   ],\n   [\n    \"PAgP ON\",\n    \"A mode that forces an interface to form a channel without exchanging PAgP packets.\"\n   ],\n   [\n    \"PAgP DESIRABLE\",\n    \"A PAgP mode that actively initiates negotiation by sending PAgP packets.\"\n   ],\n   [\n    \"PAgP AUTO\",\n    \"A PAgP mode that passively responds to received PAgP packets but does not initiate negotiation.\"\n   ],\n   [\n    \"LACP ON\",\n    \"A mode that forces an interface to form a channel without exchanging LACP packets.\"\n   ],\n   [\n    \"LACP ACTIVE\",\n    \"A LACP mode that actively initiates negotiations by sending LACP packets.\"\n   ],\n   [\n    \"LACP PASSIVE\",\n    \"A LACP mode that responds to received LACP packets but does not initiate negotiation.\"\n   ],\n   [\n    \"SPEED AND DUPLEX MATCH\",\n    \"The requirement that all interfaces in an EtherChannel operate at the same speed and duplex mode.\"\n   ],\n   [\n    \"VLAN MATCH\",\n    \"The requirement that all interfaces in an EtherChannel be assigned to the same VLAN or configured as a trunk.\"\n   ],\n   [\n    \"ALLOWED VLAN RANGE\",\n    \"The VLAN range that must be the same on all interfaces in a trunking EtherChannel.\"\n   ],\n   [\n    \"SHOW INTERFACES PORT-CHANNEL\",\n    \"A command that displays the general status of the port-channel interface.\"\n   ],\n   [\n    \"SHOW ETHERCHANNEL SUMMARY\",\n    \"A command that displays one line of information for each port channel.\"\n   ],\n   [\n    \"SHOW ETHERCHANNEL PORT-CHANNEL\",\n    \"A command that displays information about a specific port-channel interface.\"\n   ],\n   [\n    \"SHOW INTERFACES ETHERCHANNEL\",\n    \"A command that provides information about the role of a physical member interface in an EtherChannel.\"\n   ],\n   [\n    \"ETHERCHANNEL CONFIGURATION CONSISTENCY\",\n    \"The requirement that EtherChannel interfaces have matching speed, duplex, native VLAN, allowed VLANs, and access VLAN settings.\"\n   ]\n  ]\n },\n {\n  \"module\": \"MODULE 7 — DHCPv4\",\n  \"short\": \"Module 7\",\n  \"terms\": [\n   [\n    \"DHCPv4\",\n    \"Dynamic Host Configuration Protocol version 4, which dynamically assigns IPv4 addresses and other network configuration information.\"\n   ],\n   [\n    \"DHCPv4 SERVER\",\n    \"A device that assigns or leases IPv4 addresses and network configuration information to DHCP clients.\"\n   ],\n   [\n    \"DHCPv4 CLIENT\",\n    \"A device that communicates with a DHCPv4 server to obtain an IPv4 address and other network configuration information.\"\n   ],\n   [\n    \"CLIENT/SERVER MODEL\",\n    \"The DHCPv4 operating model in which a client requests network configuration information and a server assigns or leases it.\"\n   ],\n   [\n    \"DHCP LEASE\",\n    \"The temporary assignment of an IPv4 address and related network configuration information to a client.\"\n   ],\n   [\n    \"DHCPDISCOVER\",\n    \"The first DHCPv4 message sent by a client when it begins the process of obtaining an IPv4 lease.\"\n   ],\n   [\n    \"DHCPOFFER\",\n    \"The DHCPv4 message sent by a server offering an IPv4 address and configuration information to a client.\"\n   ],\n   [\n    \"DHCPREQUEST\",\n    \"The DHCPv4 message used by a client to request an offered IPv4 address or renew an existing lease.\"\n   ],\n   [\n    \"DHCPACK\",\n    \"The DHCPv4 acknowledgment sent by the server to confirm the client's lease information.\"\n   ],\n   [\n    \"LEASE ACQUISITION\",\n    \"The four-step DHCPv4 process consisting of DHCPDISCOVER, DHCPOFFER, DHCPREQUEST, and DHCPACK.\"\n   ],\n   [\n    \"LEASE RENEWAL\",\n    \"The process in which a DHCP client requests an extension of its existing IPv4 lease before the lease expires.\"\n   ],\n   [\n    \"DIRECT DHCPREQUEST\",\n    \"The DHCPREQUEST sent directly to the DHCPv4 server that originally offered the IPv4 address during lease renewal.\"\n   ],\n   [\n    \"BROADCAST DHCPREQUEST\",\n    \"A DHCPREQUEST broadcast by the client when it does not receive a DHCPACK within the specified amount of time, allowing another DHCPv4 server to extend the lease.\"\n   ],\n   [\n    \"DHCPACK VERIFICATION\",\n    \"The process in which the DHCP server verifies lease information and returns a DHCPACK after receiving a DHCPREQUEST.\"\n   ],\n   [\n    \"NO SERVICE DHCP\",\n    \"The global configuration command used to disable the Cisco IOS DHCPv4 server.\"\n   ],\n   [\n    \"SERVICE DHCP\",\n    \"The global configuration command used to re-enable the Cisco IOS DHCPv4 server process.\"\n   ],\n   [\n    \"IP ADDRESS DHCP\",\n    \"The interface configuration command used to configure an Ethernet interface as a DHCP client.\"\n   ]\n  ]\n }\n];\n\nlet currentModule = 0;\nlet order = [];\nlet currentIndex = 0;\nlet flipped = false;\nlet mode = 'term'; // 'term' = term shown first, 'def' = definition shown first\n\nconst moduleTabsEl = document.getElementById('moduleTabs');\nconst frontText = document.getElementById('frontText');\nconst backText = document.getElementById('backText');\nconst frontLabel = document.getElementById('frontLabel');\nconst backLabel = document.getElementById('backLabel');\nconst cardEl = document.getElementById('card');\nconst cardPos = document.getElementById('cardPos');\nconst progressFill = document.getElementById('progressFill');\nconst moduleLabel = document.getElementById('moduleLabel');\nconst totalCount = document.getElementById('totalCount');\nconst flipState = document.getElementById('flipState');\n\nfunction shortModuleLabel(name){\n  return name.split('—')[0].trim();\n}\n\nfunction buildTabs(){\n  moduleTabsEl.innerHTML = '';\n  DATA.forEach((mod, i) => {\n    const btn = document.createElement('button');\n    btn.className = 'mod-btn' + (i === currentModule ? ' active' : '');\n    btn.title = mod.module;\n    btn.innerHTML = mod.short + '<span class=\"count\">' + mod.terms.length + '<\/span>';\n    btn.addEventListener('click', () => selectModule(i));\n    moduleTabsEl.appendChild(btn);\n  });\n}\n\nfunction selectModule(i){\n  currentModule = i;\n  order = DATA[i].terms.map((_, idx) => idx);\n  currentIndex = 0;\n  flipped = false;\n  buildTabs();\n  render();\n}\n\nfunction render(){\n  const mod = DATA[currentModule];\n  const termIndex = order[currentIndex];\n  const [term, def] = mod.terms[termIndex];\n\n  if(mode === 'term'){\n    frontLabel.textContent = 'TERM';\n    backLabel.textContent = 'DEFINITION';\n    frontText.textContent = term;\n    backText.textContent = def;\n    frontText.className = 'term';\n    backText.className = 'definition';\n  } else {\n    frontLabel.textContent = 'DEFINITION';\n    backLabel.textContent = 'TERM';\n    frontText.textContent = def;\n    backText.textContent = term;\n    frontText.className = 'definition';\n    backText.className = 'term';\n  }\n\n  [frontText, backText].forEach(el => { el.style.fontSize = (el.className === 'term' && el.textContent.length > 38) ? 'clamp(16px, 2.6vw, 20px)' : ''; });\n  cardEl.classList.toggle('flipped', flipped);\n  flipState.textContent = flipped ? ('showing ' + (mode === 'term' ? 'definition' : 'term')) : 'tap to flip';\n  cardPos.textContent = (currentIndex + 1) + ' / ' + mod.terms.length;\n  progressFill.style.width = (((currentIndex + 1) / mod.terms.length) * 100) + '%';\n  moduleLabel.textContent = mod.module;\n  totalCount.textContent = DATA.reduce((sum, m) => sum + m.terms.length, 0);\n}\n\nfunction setMode(newMode){\n  mode = newMode;\n  flipped = false;\n  document.querySelectorAll('.mode-opt').forEach(btn => {\n    btn.classList.toggle('active', btn.dataset.mode === newMode);\n  });\n  render();\n}\n\nfunction flip(){\n  flipped = !flipped;\n  cardEl.classList.toggle('flipped', flipped);\n  flipState.textContent = flipped ? 'showing definition' : 'tap to flip';\n}\n\nfunction next(){\n  currentIndex = (currentIndex + 1) % order.length;\n  flipped = false;\n  render();\n}\n\nfunction prev(){\n  currentIndex = (currentIndex - 1 + order.length) % order.length;\n  flipped = false;\n  render();\n}\n\nfunction shuffleModule(){\n  for(let i = order.length - 1; i > 0; i--){\n    const j = Math.floor(Math.random() * (i + 1));\n    [order[i], order[j]] = [order[j], order[i]];\n  }\n  currentIndex = 0;\n  flipped = false;\n  render();\n}\n\nfunction restartOrder(){\n  order = DATA[currentModule].terms.map((_, idx) => idx);\n  currentIndex = 0;\n  flipped = false;\n  render();\n}\n\ndocument.querySelectorAll('.mode-opt').forEach(btn => {\n  btn.addEventListener('click', () => setMode(btn.dataset.mode));\n});\n\ncardEl.addEventListener('click', flip);\ndocument.getElementById('flipBtn').addEventListener('click', flip);\ndocument.getElementById('nextBtn').addEventListener('click', next);\ndocument.getElementById('prevBtn').addEventListener('click', prev);\ndocument.getElementById('shuffleBtn').addEventListener('click', shuffleModule);\ndocument.getElementById('restartBtn').addEventListener('click', restartOrder);\n\ndocument.addEventListener('keydown', (e) => {\n  if(e.code === 'Space'){ e.preventDefault(); flip(); }\n  else if(e.code === 'ArrowRight'){ next(); }\n  else if(e.code === 'ArrowLeft'){ prev(); }\n  else if(e.code === 'KeyS'){ shuffleModule(); }\n});\n\nbuildTabs();\nselectModule(0);\n<\/script>\n\n<\/body>\n<\/html>\n"}];

/* ---------- storage (IndexedDB, with in-memory fallback) ---------- */
let db = null;
let mem = [];
const memMeta = {};

function openDB(){
  return new Promise((resolve, reject) => {
    try{
      const r = indexedDB.open('martinis-cards', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore('reviewers', { keyPath: 'id' });
        d.createObjectStore('meta', { keyPath: 'k' });
      };
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    }catch(e){ reject(e); }
  });
}
const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const store = (n, m = 'readonly') => db.transaction(n, m).objectStore(n);

async function getAll(){ return db ? reqP(store('reviewers').getAll()) : mem.slice(); }
async function put(rec){
  if(!db){ mem = mem.filter(x => x.id !== rec.id); mem.push(rec); return; }
  return reqP(store('reviewers', 'readwrite').put(rec));
}
async function del(id){
  if(!db){ mem = mem.filter(x => x.id !== id); return; }
  return reqP(store('reviewers', 'readwrite').delete(id));
}
async function getMeta(k){
  if(!db) return memMeta[k];
  const r = await reqP(store('meta').get(k));
  return r ? r.v : undefined;
}
async function setMeta(k, v){
  if(!db){ memMeta[k] = v; return; }
  return reqP(store('meta', 'readwrite').put({ k, v }));
}

/* ---------- reading info out of a reviewer file ---------- */
function countCards(html){
  const i = html.indexOf('const DATA = ');
  if(i < 0) return null;
  const j = html.indexOf('[', i);
  let depth = 0, inStr = false, esc = false, k = j;
  for(; k < html.length; k++){
    const ch = html[k];
    if(inStr){
      if(esc) esc = false;
      else if(ch === '\\') esc = true;
      else if(ch === '"') inStr = false;
      continue;
    }
    if(ch === '"') inStr = true;
    else if(ch === '[') depth++;
    else if(ch === ']'){ depth--; if(depth === 0) break; }
  }
  const data = JSON.parse(html.slice(j, k + 1));
  let n = 0;
  data.forEach(item => {
    if(item.terms) n += item.terms.length;
    if(item.sections) item.sections.forEach(s => { n += (s.terms || []).length; });
  });
  return n;
}

function extractMeta(html, fallbackName){
  let title = fallbackName;
  const t = html.match(/<title>([\s\S]*?)<\/title>/i);
  if(t){
    title = t[1].replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').trim();
  }
  title = title.replace(/\s*[—-]\s*(Flashcard Reviewer|Flashcards)\s*$/i, '') || fallbackName;
  const c = html.match(/--cyan:\s*(#[0-9a-fA-F]{3,8})/);
  const color = c ? c[1] : '#c9dc72';
  let cards = null;
  try{ cards = countCards(html); }catch(e){ cards = null; }
  return { title, color, cards };
}

/* ---------- ui ---------- */
const grid = document.getElementById('grid');
const countNum = document.getElementById('countNum');
const countLabel = document.getElementById('countLabel');
const toastEl = document.getElementById('toast');
let toastTimer = null;

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
}

function fmtDate(ts){
  return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

async function refresh(){
  const list = (await getAll()).sort((a, b) => b.added - a.added);
  grid.innerHTML = '';
  countNum.textContent = list.length;
  countLabel.textContent = list.length === 1 ? 'reviewer' : 'reviewers';

  if(!list.length){
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = 'The shelf is empty. Add a reviewer to get started.';
    grid.appendChild(e);
    return;
  }

  list.forEach(rec => {
    const tile = document.createElement('article');
    tile.className = 'tile';
    tile.style.setProperty('--c', rec.color || '#c9dc72');

    const h = document.createElement('h3');
    h.textContent = rec.title;

    const meta = document.createElement('div');
    meta.className = 'meta';
    const bits = [];
    if(rec.cards != null) bits.push(rec.cards + ' cards');
    bits.push(rec.builtin ? 'built-in' : 'added ' + fmtDate(rec.added));
    meta.textContent = bits.join(' · ');

    const actions = document.createElement('div');
    actions.className = 'actions';

    const open = document.createElement('button');
    open.className = 'btn open';
    open.textContent = 'Open';
    open.addEventListener('click', () => openReader(rec));

    const delBtn = document.createElement('button');
    delBtn.className = 'btn del';
    delBtn.textContent = 'Delete';
    let timer = null;
    delBtn.addEventListener('click', async () => {
      if(!delBtn.classList.contains('armed')){
        delBtn.classList.add('armed');
        delBtn.textContent = 'Sure?';
        timer = setTimeout(() => {
          delBtn.classList.remove('armed');
          delBtn.textContent = 'Delete';
        }, 3000);
        return;
      }
      clearTimeout(timer);
      tile.classList.add('gone');
      await del(rec.id);
      setTimeout(refresh, 250);
      toast('Removed ' + rec.title);
    });

    actions.append(open, delBtn);
    tile.append(h, meta, actions);
    grid.appendChild(tile);
  });
}

/* ---------- reader ---------- */
const reader = document.getElementById('reader');
const frame = document.getElementById('frame');
const readerTitle = document.getElementById('readerTitle');

function openReader(rec){
  readerTitle.textContent = rec.title;
  frame.addEventListener('load', () => { try{ frame.focus(); }catch(e){} }, { once: true });
  frame.srcdoc = rec.html;
  reader.hidden = false;
  document.body.classList.add('reading');
}
function closeReader(){
  reader.hidden = true;
  frame.srcdoc = '';
  document.body.classList.remove('reading');
}
document.getElementById('backBtn').addEventListener('click', closeReader);
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && !reader.hidden) closeReader();
});

/* ---------- adding reviewers ---------- */
async function addFiles(files){
  let added = 0, skipped = 0;
  for(const f of files){
    if(!/\.html?$/i.test(f.name)){ skipped++; continue; }
    const text = await f.text();
    if(text.indexOf('<') < 0){ skipped++; continue; }
    const base = f.name.replace(/\.html?$/i, '').replace(/[_-]+/g, ' ');
    const m = extractMeta(text, base);
    await put({
      id: 'u' + Date.now() + Math.random().toString(36).slice(2, 7),
      title: m.title, html: text, color: m.color, cards: m.cards,
      added: Date.now(), builtin: false
    });
    added++;
  }
  await refresh();
  if(added) toast('Added ' + added + (added === 1 ? ' reviewer' : ' reviewers'));
  else if(skipped) toast('Only .html reviewer files can be added');
}

const fileInput = document.getElementById('fileInput');
document.getElementById('addBtn').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', async () => {
  await addFiles(Array.from(fileInput.files));
  fileInput.value = '';
});

const drop = document.getElementById('drop');
['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.add('over');
}));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault();
  if(ev === 'drop' || e.target === document.documentElement || e.relatedTarget === null) drop.classList.remove('over');
}));
document.addEventListener('drop', e => {
  if(e.dataTransfer && e.dataTransfer.files.length) addFiles(Array.from(e.dataTransfer.files));
});

/* ---------- built-in reviewers ---------- */
async function installSeeds(onlyMissing){
  const have = new Set((await getAll()).map(r => r.id));
  const now = Date.now();
  let n = 0;
  for(let i = 0; i < SEED.length; i++){
    const s = SEED[i];
    if(onlyMissing && have.has(s.id)) continue;
    const m = extractMeta(s.html, s.title);
    await put({
      id: s.id, title: s.title, html: s.html, color: m.color, cards: m.cards,
      added: now - i * 1000, builtin: true
    });
    n++;
  }
  return n;
}

document.getElementById('restoreBtn').addEventListener('click', async () => {
  const n = await installSeeds(true);
  await refresh();
  toast(n ? 'Restored ' + n + (n === 1 ? ' built-in reviewer' : ' built-in reviewers') : 'All built-in reviewers are already on the shelf');
});

/* ---------- start ---------- */
(async function init(){
  try{
    db = await openDB();
  }catch(e){
    db = null;
    const n = document.getElementById('notice');
    n.textContent = "Browser storage isn't available here, so changes won't be saved after you close this page.";
    n.hidden = false;
  }
  if(!(await getMeta('seeded'))){
    await installSeeds(false);
    await setMeta('seeded', true);
  }
  await refresh();
})();
</script>
