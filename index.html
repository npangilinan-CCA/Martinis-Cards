<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Martini's Cards</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8D%B8%3C/text%3E%3C/svg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #10150f;
    --panel: #172017;
    --panel-2: #1d291d;
    --line: #2d3f2c;
    --line-soft: #1f2d1f;
    --text: #eef3e6;
    --muted: #a2b494;
    --muted-2: #6b7f5f;
    --olive: #c9dc72;
    --olive-dim: #6f7f2f;
    --danger: #ff8080;
    --danger-dim: #7a2f2f;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100%;
  }

  body{
    min-height: 100vh;
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size: 48px 48px;
    background-position: -1px -1px;
    background-attachment: fixed;
  }
  body.reading{ overflow: hidden; }

  .wrap{
    max-width: 960px;
    margin: 0 auto;
    padding: 36px 20px 70px;
    padding-top: calc(36px + env(safe-area-inset-top, 0px));
  }

  /* header */
  header{
    display:flex;
    align-items:center;
    gap: 16px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 26px;
  }
  .logo{ width: 52px; height: 52px; color: var(--text); flex: none; }
  h1{
    font-family:'IBM Plex Mono', monospace;
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: .2px;
  }
  h1 span{ color: var(--olive); }
  .tagline{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--muted);
  }

  /* toolbar */
  .toolbar{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .count{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--muted);
  }
  .count b{ color: var(--olive); font-weight: 600; }

  .btn{
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: border-color .15s ease, transform .1s ease, opacity .15s ease;
  }
  .btn:hover{ border-color: var(--olive-dim); }
  .btn:active{ transform: scale(.97); }
  .btn.primary{
    background: var(--olive);
    border-color: var(--olive);
    color: var(--bg);
    font-weight: 600;
  }
  .btn.primary:hover{ opacity: .9; }

  /* drop zone */
  .drop{
    border: 1.5px dashed var(--line);
    border-radius: 12px;
    padding: 18px;
    text-align: center;
    color: var(--muted-2);
    font-family:'IBM Plex Mono', monospace;
    font-size: 12.5px;
    cursor: pointer;
    margin-bottom: 26px;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .drop:hover, .drop.over{
    border-color: var(--olive);
    color: var(--olive);
    background: rgba(201,220,114,.05);
  }

  /* shelf */
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }

  .tile{
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px 18px 16px;
    overflow: hidden;
    display:flex;
    flex-direction: column;
    gap: 8px;
    transition: border-color .15s ease, transform .15s ease, opacity .25s ease;
  }
  .tile:hover{ border-color: var(--c, var(--olive)); }
  .tile::before{
    content:"";
    position:absolute;
    left:0; top:0; right:0;
    height: 4px;
    background: var(--c, var(--olive));
  }
  .tile.gone{ opacity: 0; transform: scale(.96); }

  .tile h3{
    font-family:'IBM Plex Mono', monospace;
    font-size: 16px;
    font-weight: 600;
    color: var(--c, var(--olive));
    margin: 4px 0 0;
    line-height: 1.35;
    word-break: break-word;
  }
  .meta{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--muted-2);
    flex: 1;
  }
  .actions{
    display:flex;
    gap: 8px;
    margin-top: 10px;
  }
  .actions .btn{ padding: 8px 14px; font-size: 12.5px; }
  .actions .open{
    flex: 1;
    background: var(--c, var(--olive));
    border-color: var(--c, var(--olive));
    color: #10150f;
    font-weight: 600;
  }
  .actions .del{ color: var(--muted); }
  .actions .del:hover{ border-color: var(--danger-dim); color: var(--danger); }
  .actions .del.armed{
    background: var(--danger-dim);
    border-color: var(--danger);
    color: #fff;
  }

  .empty{
    grid-column: 1 / -1;
    text-align:center;
    padding: 44px 16px;
    color: var(--muted-2);
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
  }

  footer{
    margin-top: 40px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--muted-2);
    line-height: 1.7;
    text-align:center;
  }
  footer button{
    background:none; border:none; padding:0;
    color: var(--muted);
    font: inherit;
    text-decoration: underline;
    cursor:pointer;
  }
  footer button:hover{ color: var(--olive); }

  .notice{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--danger);
    border: 1px solid var(--danger-dim);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 16px;
  }

  /* reader */
  .reader{
    position: fixed;
    inset: 0;
    z-index: 50;
    background: var(--bg);
    display:flex;
    flex-direction: column;
  }
  .reader[hidden]{ display:none; }
  .reader-bar{
    display:flex;
    align-items:center;
    gap: 14px;
    padding: 10px 14px;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .reader-bar .btn{ padding: 7px 12px; font-size: 12.5px; }
  .reader-title{
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .reader iframe{
    flex: 1;
    width: 100%;
    border: 0;
    background: var(--bg);
  }

  /* toast */
  .toast{
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(20px);
    background: var(--panel-2);
    border: 1px solid var(--olive-dim);
    color: var(--text);
    font-family:'IBM Plex Mono', monospace;
    font-size: 12.5px;
    padding: 10px 16px;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 60;
    max-width: 90vw;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 520px){
    h1{ font-size: 22px; }
    .logo{ width: 42px; height: 42px; }
  }
  @media (prefers-reduced-motion: reduce){
    .tile, .btn, .toast{ transition: none; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <svg class="logo" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15 17h34L32 33z" fill="rgba(201,220,114,.22)" stroke="none"/>
      <path d="M10 12h44L32 36z"/>
      <path d="M32 36v18M21 55h22"/>
      <path d="M47 5L35 28" stroke="#6f7f2f"/>
      <circle cx="38.5" cy="22" r="4.5" fill="#c9dc72" stroke="none"/>
    </svg>
    <div>
      <h1>Martini's <span>Cards</span></h1>
      <div class="tagline">your exam reviewers, all on one shelf</div>
    </div>
  </header>

  <div id="notice" class="notice" hidden></div>

  <div class="toolbar">
    <div class="count"><b id="countNum">0</b> <span id="countLabel">reviewers</span> on the shelf</div>
    <button class="btn primary" id="addBtn">+ Add reviewer</button>
  </div>

  <label class="drop" id="drop" for="fileInput">
    Drop reviewer .html files here, or click to browse
  </label>
  <input type="file" id="fileInput" accept=".html,.htm,text/html" multiple hidden>

  <div class="grid" id="grid"></div>

  <footer>
    Reviewers are saved in this browser, so uploads on one device won't appear on another.<br>
    Deleting only removes a card from your shelf. &nbsp;·&nbsp; <button id="restoreBtn">Restore built-in reviewers</button>
  </footer>
</div>

<div class="reader" id="reader" hidden>
  <div class="reader-bar">
    <button class="btn" id="backBtn">← Back to shelf</button>
    <div class="reader-title" id="readerTitle"></div>
  </div>
  <iframe id="frame" sandbox="allow-scripts" title="Reviewer"></iframe>
</div>

<div class="toast" id="toast"></div>

<script>
const SEED = [{"id": "net2-questions", "title": "NET2 · 88 Questions", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>NET2 — Question Reviewer<\/title>\n<style>\n  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');\n\n  :root{\n    --bg: #1d0f14;\n    --panel: #2a1520;\n    --panel-2: #321a27;\n    --line: #55293a;\n    --line-soft: #3a1c29;\n    --text: #f9eaee;\n    --muted: #d1a0ae;\n    --muted-2: #9b6b7b;\n    --cyan: #ff7f96;\n    --cyan-dim: #b0394f;\n    --amber: #ffb3c1;\n    --amber-dim: #7a2a3b;\n    --card-back: #231017;\n  }\n\n  *{ box-sizing: border-box; }\n\n  html,body{\n    margin:0; padding:0;\n    background: var(--bg);\n    color: var(--text);\n    font-family: 'Inter', sans-serif;\n    min-height: 100vh;\n  }\n\n  body{\n    background-image:\n      linear-gradient(var(--line-soft) 1px, transparent 1px),\n      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);\n    background-size: 48px 48px;\n    background-position: -1px -1px;\n    background-attachment: fixed;\n  }\n\n  .wrap{\n    max-width: 860px;\n    margin: 0 auto;\n    padding: 36px 20px 80px;\n  }\n\n  header{\n    display:flex;\n    align-items: baseline;\n    justify-content: space-between;\n    gap: 16px;\n    margin-bottom: 28px;\n    flex-wrap: wrap;\n    border-bottom: 1px solid var(--line);\n    padding-bottom: 18px;\n  }\n\n  .brand{\n    display:flex;\n    align-items:baseline;\n    gap: 10px;\n  }\n\n  .brand .dot{\n    width: 9px; height:9px;\n    border-radius: 50%;\n    background: var(--cyan);\n    box-shadow: 0 0 8px var(--cyan);\n    display:inline-block;\n    transform: translateY(-2px);\n  }\n\n  h1{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 20px;\n    font-weight: 600;\n    margin: 0;\n    letter-spacing: 0.2px;\n  }\n\n  .subtitle{\n    font-size: 13px;\n    color: var(--muted);\n    font-family:'IBM Plex Mono', monospace;\n  }\n\n  .stat{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 12.5px;\n    color: var(--muted);\n    text-align: right;\n  }\n\n  .stat b{ color: var(--cyan); font-weight:600; }\n\n  /* module tabs */\n  .modules{\n    display:flex;\n    flex-wrap: wrap;\n    gap: 8px;\n    margin-bottom: 26px;\n  }\n\n  .mod-btn{\n    background: var(--panel);\n    border: 1px solid var(--line);\n    color: var(--muted);\n    font-family: 'IBM Plex Mono', monospace;\n    font-size: 12.5px;\n    padding: 8px 12px;\n    border-radius: 7px;\n    cursor: pointer;\n    transition: border-color .15s ease, color .15s ease, background .15s ease;\n    line-height: 1.3;\n  }\n\n  .mod-btn:hover{ border-color: var(--cyan-dim); color: var(--text); }\n\n  .mod-btn.active{\n    border-color: var(--cyan);\n    color: var(--bg);\n    background: var(--cyan);\n    font-weight: 600;\n  }\n\n  .mod-btn .count{\n    opacity: .65;\n    margin-left: 4px;\n  }\n  .mod-btn.active .count{ opacity:.55; }\n\n  /* front-side mode toggle */\n  .mode-row{\n    display:flex;\n    align-items:center;\n    gap: 10px;\n    margin-bottom: 22px;\n  }\n\n  .mode-label{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 12px;\n    color: var(--muted-2);\n  }\n\n  .mode-toggle{\n    display:inline-flex;\n    background: var(--panel);\n    border: 1px solid var(--line);\n    border-radius: 8px;\n    padding: 3px;\n    gap: 3px;\n  }\n\n  .mode-opt{\n    background: transparent;\n    border: none;\n    color: var(--muted);\n    font-family: 'IBM Plex Mono', monospace;\n    font-size: 12px;\n    padding: 6px 12px;\n    border-radius: 6px;\n    cursor: pointer;\n    transition: background .15s ease, color .15s ease;\n  }\n\n  .mode-opt:hover{ color: var(--text); }\n\n  .mode-opt.active{\n    background: var(--cyan);\n    color: var(--bg);\n    font-weight: 600;\n  }\n\n  /* card area */\n  .stage{\n    display:flex;\n    flex-direction: column;\n    align-items: center;\n    gap: 18px;\n  }\n\n  .progress-row{\n    width: 100%;\n    display:flex;\n    align-items:center;\n    gap: 12px;\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 12px;\n    color: var(--muted-2);\n  }\n\n  .progress-track{\n    flex:1;\n    height: 4px;\n    background: var(--line-soft);\n    border-radius: 4px;\n    overflow: hidden;\n  }\n  .progress-fill{\n    height:100%;\n    background: linear-gradient(90deg, var(--cyan-dim), var(--cyan));\n    width: 0%;\n    transition: width .25s ease;\n  }\n\n  .card-scene{\n    width: 100%;\n    max-width: 640px;\n    perspective: 1400px;\n  }\n\n  .card{\n    position: relative;\n    width: 100%;\n    min-height: 260px;\n    cursor: pointer;\n    transform-style: preserve-3d;\n    transition: transform .45s cubic-bezier(.4,.2,.2,1);\n  }\n\n  .card.flipped{ transform: rotateY(180deg); }\n\n  .face{\n    position:absolute;\n    inset:0;\n    backface-visibility: hidden;\n    border-radius: 12px;\n    border: 1px solid var(--line);\n    padding: 34px 32px;\n    display:flex;\n    flex-direction:column;\n    justify-content:center;\n    align-items:center;\n    text-align:center;\n    gap: 14px;\n  }\n\n  .face-front{\n    background: var(--panel);\n    box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset, 0 18px 40px -20px rgba(0,0,0,.6);\n  }\n\n  .face-back{\n    background: var(--card-back);\n    transform: rotateY(180deg);\n    border-color: var(--cyan-dim);\n  }\n\n  .face-label{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 10.5px;\n    letter-spacing: 1.5px;\n    color: var(--muted-2);\n  }\n\n  .term{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: clamp(19px, 3.4vw, 26px);\n    font-weight: 600;\n    color: var(--cyan);\n    line-height: 1.35;\n  }\n\n  .definition{\n    font-size: 16.5px;\n    line-height: 1.55;\n    color: var(--text);\n    max-width: 480px;\n  }\n\n  .hint{\n    position:absolute;\n    bottom: 14px;\n    font-size: 11px;\n    color: var(--muted-2);\n    font-family:'IBM Plex Mono', monospace;\n  }\n\n  .controls{\n    display:flex;\n    align-items:center;\n    gap: 10px;\n    margin-top: 4px;\n  }\n\n  .ctrl-btn{\n    background: var(--panel);\n    border: 1px solid var(--line);\n    color: var(--text);\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 13px;\n    padding: 10px 16px;\n    border-radius: 8px;\n    cursor: pointer;\n    display:flex;\n    align-items:center;\n    gap: 6px;\n    transition: border-color .15s ease, transform .1s ease;\n  }\n\n  .ctrl-btn:hover{ border-color: var(--cyan-dim); }\n  .ctrl-btn:active{ transform: scale(0.97); }\n\n  .ctrl-btn.primary{\n    background: var(--cyan);\n    color: var(--bg);\n    border-color: var(--cyan);\n    font-weight: 600;\n  }\n  .ctrl-btn.primary:hover{ opacity: .9; }\n\n  .ctrl-btn.ghost{ color: var(--muted); }\n\n  .ctrl-btn svg{ width: 14px; height:14px; }\n\n  .kbd-hint{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 11px;\n    color: var(--muted-2);\n    margin-top: 2px;\n  }\n  .kbd-hint kbd{\n    border: 1px solid var(--line);\n    border-radius: 4px;\n    padding: 1px 5px;\n    font-family: inherit;\n    color: var(--muted);\n  }\n\n  footer{\n    text-align:center;\n    margin-top: 44px;\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 11.5px;\n    color: var(--muted-2);\n  }\n\n  @media (max-width: 520px){\n    .face{ padding: 26px 20px; }\n    header{ flex-direction: column; align-items:flex-start; }\n    .stat{ text-align:left; }\n  }\n\n  @media (prefers-reduced-motion: reduce){\n    .card, .progress-fill{ transition: none; }\n  }\n<\/style>\n<\/head>\n<body>\n\n<div class=\"wrap\">\n\n  <header>\n    <div>\n      <div class=\"brand\"><span class=\"dot\"><\/span><h1>NET2 — Question Reviewer<\/h1><\/div>\n      <div class=\"subtitle\">IPv6 · FHRP · security &amp; AAA · routing · static routes<\/div>\n    <\/div>\n    <div class=\"stat\">\n tton class=\"ctrl-btn\" id=\"shuffleBtn\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5\"/><\/svg>\n        Shuffle module\n      <\/button>\n      <button class=\"ctrl-btn\" id=\"restartBtn\">Restart order<\/button>\n    <\/div>\n    <div class=\"kbd-hint\"><kbd>←<\/kbd> <kbd>→<\/kbd> navigate &nbsp; <kbd>space<\/kbd> flip &nbsp; <kbd>S<\/kbd> shuffle<\/div>\n  <\/div>\n\n  <footer>Source: NET2 — 88 questions, 5 categories<\/footer>\n<\/div>\n\n<script>\nconst DATA = [\n {\n  \"module\": \"Category 1 – IPv6 Addressing and DHCPv6\",\n  \"short\": \"IPv6 & DHCPv6\",\n  \"terms\": [\n   [\n    \"It sends an ICMPv6 Neighbor Solicitation message with the IPv6 address as the target IPv6 address.\",\n    \"How does an IPv6 client ensure that it has a unique address after it configures its IPv6 address using the SLAAC allocation method?\"\n   ],\n   [\n    \"Router advertisements that are received from the link router.\",\n    \"Which method would an IPv6-enabled host using SLAAC employ to learn the address of the default gateway?\"\n   ],\n   [\n    \"The ICMPv6 Router Advertisement.\",\n    \"What message informs IPv6 enabled interfaces to use stateful DHCPv6 for obtaining an IPv6 address?\"\n   ],\n   [\n    \"FF02::1:2.\",\n    \"Which destination IP address is used when an IPv6 host sends a DHCPv6 SOLICIT message to locate a DHCPv6 server?\"\n   ],\n   [\n    \"SLAAC.\",\n    \"In which alternative to DHCPv6 does a router dynamically provide IPv6 configuration information to hosts?\"\n   ],\n   [\n    \"DAD.\",\n    \"What process is used in ICMPv6 for a host to verify that an IPv6 address is unique before configuring it on an interface?\"\n   ],\n   [\n    \"The client should automatically configure an IPv6 address and then contact a DHCPv6 server for more information.\",\n    \"After booting, a client receives an ICMPv6 RA message with the M flag set to 0 and e is no route in the routing table.\",\n    \"A network administrator configures a router by the command ip route 0.0.0.0 0.0.0.0 209.165.200.226. What is the purpose of this command?\"\n   ],\n   [\n    \"Directly connected static route.\",\n    \"Which type of static route that is configured on a router uses only the exit interface?\"\n   ],\n   [\n    \"The administrative distance value is not high enough on the static route.\",\n    \"A network administrator uses the command ip route 172.18.0.0 255.255.0.0 S0/0/1 to configure a floating static route on a router. That route will function as a backup route to reach the EIGRP learned network 172.18.0.0/16. After this configuration, the EIGRP route is removed from the routing table even though EIGRP is still functioning properly. Why is the static route not functioning as intended?\"\n   ],\n   [\n    \"Fully specified static route.\",\n    \"What type of static route is created when the next-hop IP address and exit interface are specified?\"\n   ],\n   [\n    \"ip route 209.165.200.228 255.255.255.248 10.0.0.1 120.\",\n    \"What is the correct syntax of a floating static route?\"\n   ],\n   [\n    \"ipv6 route 2001:db8:cafe:1::/56 2001:db8:1000:10::1.\",\n    \"Which static route statement shows a recursive IPv6 static route?\"\n   ],\n   [\n    \"A host route.\",\n    \"A network administrator is configuring a route to forward packets to a specific web server. What type of route should be configured by the administrator?\"\n   ],\n   [\n    \"ipv6 route ::/0 fe80::1.\",\n    \"Which command would create a valid IPv6 default route?\"\n   ],\n   [\n    \"It identifies the gateway IP address to which the router sends all IP packets for which it does not have a learned or static route.\",\n    \"What is a characteristic of a default static route?\"\n   ],\n   [\n    \"It allows an alternate connection to be used when the preferred link fails.\",\n    \"What is the purpose of a floating static route?\"\n   ],\n   [\n ('backText');\nconst frontLabel = document.getElementById('frontLabel');\nconst backLabel = document.getElementById('backLabel');\nconst cardEl = document.getElementById('card');\nconst cardPos = document.getElementById('cardPos');\nconst progressFill = document.getElementById('progressFill');\nconst moduleLabel = document.getElementById('moduleLabel');\nconst totalCount = document.getElementById('totalCount');\nconst flipState = document.getElementById('flipState');\n\nfunction shortModuleLabel(name){\n  return name.split('—')[0].trim();\n}\n\nfunction buildTabs(){\n  moduleTabsEl.innerHTML = '';\n  DATA.forEach((mod, i) => {\n    const btn = document.createElement('button');\n    btn.className = 'mod-btn' + (i === currentModule ? ' active' : '');\n    btn.title = mod.module;\n    btn.innerHTML = mod.short + '<span class=\"count\">' + mod.terms.length + '<\/span>';\n    btn.addEventListener('click', () => selectModule(i));\n    moduleTabsEl.appendChild(btn);\n  });\n}\n\nfunction selectModule(i){\n  currentModule = i;\n  order = DATA[i].terms.map((_, idx) => idx);\n  currentIndex = 0;\n  flipped = false;\n  buildTabs();\n  render();\n}\n\nfunction render(){\n  const mod = DATA[currentModule];\n  const termIndex = order[currentIndex];\n  const [term, def] = mod.terms[termIndex];\n\n  if(mode === 'term'){\n    frontLabel.textContent = 'TERM';\n    backLabel.textContent = 'DEFINITION';\n    frontText.textContent = term;\n    backText.textContent = def;\n    frontText.className = 'term';\n    backText.className = 'definition';\n  } else {\n    frontLabel.textContent = 'DEFINITION';\n    backLabel.textContent = 'TERM';\n    frontText.textContent = def;\n    backText.textContent = term;\n    frontText.className = 'definition';\n    backText.className = 'term';\n  }\n\n  [frontText, backText].forEach(el => { el.style.fontSize = (el.className === 'term' && el.textContent.length > 38) ? 'clamp(16px, 2.6vw, 20px)' : ''; });\n  cardEl.classList.toggle('flipped', flipped);\n  flipState.textContent = flipped ? ('showing ' + (mode === 'term' ? 'definition' : 'term')) : 'tap to flip';\n  cardPos.textContent = (currentIndex + 1) + ' / ' + mod.terms.length;\n  progressFill.style.width = (((currentIndex + 1) / mod.terms.length) * 100) + '%';\n  moduleLabel.textContent = mod.module;\n  totalCount.textContent = DATA.reduce((sum, m) => sum + m.terms.length, 0);\n}\n\nfunction setMode(newMode){\n  mode = newMode;\n  flipped = false;\n  document.querySelectorAll('.mode-opt').forEach(btn => {\n    btn.classList.toggle('active', btn.dataset.mode === newMode);\n  });\n  render();\n}\n\nfunction flip(){\n  flipped = !flipped;\n  cardEl.classList.toggle('flipped', flipped);\n  flipState.textContent = flipped ? 'showing definition' : 'tap to flip';\n}\n\nfunction next(){\n  currentIndex = (currentIndex + 1) % order.length;\n  flipped = false;\n  render();\n}\n\nfunction prev(){\n  currentIndex = (currentIndex - 1 + order.length) % order.length;\n  flipped = false;\n  render();\n}\n\nfunction shuffleModule(){\n  for(let i = order.length - 1; i > 0; i--){\n    const j = Math.floor(Math.random() * (i + 1));\n    [order[i], order[j]] = [order[j], order[i]];\n  }\n  currentIndex = 0;\n  flipped = false;\n  render();\n}\n\nfunction restartOrder(){\n  order = DATA[currentModule].terms.map((_, idx) => idx);\n  currentIndex = 0;\n  flipped = false;\n  render();\n}\n\ndocument.querySelectorAll('.mode-opt').forEach(btn => {\n  btn.addEventListener('click', () => setMode(btn.dataset.mode));\n});\n\ncardEl.addEventListener('click', flip);\ndocument.getElementById('flipBtn').addEventListener('click', flip);\ndocument.getElementById('nextBtn').addEventListener('click', next);\ndocument.getElementById('prevBtn').addEventListener('click', prev);\ndocument.getElementById('shuffleBtn').addEventListener('click', shuffleModule);\ndocument.getElementById('restartBtn').addEventListener('click', restartOrder);\n\ndocument.addEventListener('keydown', (e) => {\n  if(e.code === 'Space'){ e.preventDefault(); flip(); }\n  else if(e.code === 'ArrowRight'){ next(); }\n  else if(e.code === 'ArrowLeft'){ prev(); }\n  else if(e.code === 'KeyS'){ shuffleModule(); }\n});\n\nbuildTabs();\nselectModule(0);\n<\/script>\n\n<\/body>\n<\/html>\n"}, {"id": "appdev", "title": "APPDEV · Final Exam", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>APPDEV — Final Exam Reviewer<\/title>\n<style>\n  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');\n\n  :root{\n    --bg: #17101f;\n    --panel: #231733;\n    --panel-2: #2a1b3d;\n    --line: #44305f;\n    --line-soft: #301f45;\n    --text: #f1eaf9;\n    --muted: #b6a0d1;\n    --muted-2: #826a9f;\n    --cyan: #b48cff;\n    --cyan-dim: #6b46b0;\n    --amber: #d2b8ff;\n    --amber-dim: #54387f;\n    --card-back: #1d1329;\n  }\n\n  *{ box-sizing: border-box; }\n\n  html,body{\n    margin:0; padding:0;\n    background: var(--bg);\n    color: var(--text);\n    font-family: 'Inter', sans-serif;\n    min-height: 100vh;\n  }\n\n  body{\n    background-image:\n      linear-gradient(var(--line-soft) 1px, transparent 1px),\n      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);\n    background-size: 48px 48px;\n    background-position: -1px -1px;\n    background-attachment: fixed;\n  }\n\n  .wrap{\n    max-width: 860px;\n    margin: 0 auto;\n    padding: 36px 20px 80px;\n  }\n\n  header{\n    display:flex;\n    align-items: baseline;\n    justify-content: space-between;\n    gap: 16px;\n    margin-bottom: 28px;\n    flex-wrap: wrap;\n    border-bottom: 1px solid var(--line);\n    padding-bottom: 18px;\n  }\n\n  .brand{\n    display:flex;\n    align-items:baseline;\n    gap: 10px;\n  }\n\n  .brand .dot{\n    width: 9px; height:9px;\n    border-radius: 50%;\n    background: var(--cyan);\n    box-shadow: 0 0 8px var(--cyan);\n    display:inline-block;\n    transform: translateY(-2px);\n  }\n\n  h1{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 20px;\n    font-weight: 600;\n    margin: 0;\n    letter-spacing: 0.2px;\n  }\n\n  .subtitle{\n    font-size: 13px;\n    color: var(--muted);\n    font-family:'IBM Plex Mono', monospace;\n  }\n\n  .stat{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 12.5px;\n    color: var(--muted);\n    text-align: right;\n  }\n\n  .stat b{ color: var(--cyan); font-weight:600; }\n\n  /* module tabs */\n  .modules{\n    display:flex;\n    flex-wrap: wrap;\n    gap: 8px;\n    margin-bottom: 26px;\n  }\n\n  .mod-btn{\n    background: var(--panel);\n    border: 1px solid var(--line);\n    color: var(--muted);\n    font-family: 'IBM Plex Mono', monospace;\n    font-size: 12.5px;\n    padding: 8px 12px;\n    border-radius: 7px;\n    cursor: pointer;\n    transition: border-color .15s ease, color .15s ease, background .15s ease;\n    line-height: 1.3;\n  }\n\n  .mod-btn:hover{ border-color: var(--cyan-dim); color: var(--text); }\n\n  .mod-btn.active{\n    border-color: var(--cyan);\n    color: var(--bg);\n    background: var(--cyan);\n    font-weight: 600;\n  }\n\n  .mod-btn .count{\n    opacity: .65;\n    margin-left: 4px;\n  }\n  .mod-btn.active .count{ opacity:.55; }\n\n  /* front-side mode toggle */\n  .mode-row{\n    display:flex;\n    align-items:center;\n    gap: 10px;\n    margin-bottom: 22px;\n  }\n\n  .mode-label{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 12px;\n    color: var(--muted-2);\n  }\n\n  .mode-toggle{\n    display:inline-flex;\n    background: var(--panel);\n    border: 1px solid var(--line);\n    border-radius: 8px;\n    padding: 3px;\n    gap: 3px;\n  }\n\n  .mode-opt{\n    background: transparent;\n    border: none;\n    color: var(--muted);\n    font-family: 'IBM Plex Mono', monospace;\n    font-size: 12px;\n    padding: 6px 12px;\n    border-radius: 6px;\n    cursor: pointer;\n    transition: background .15s ease, color .15s ease;\n  }\n\n  .mode-opt:hover{ color: var(--text); }\n\n  .mode-opt.active{\n    background: var(--cyan);\n    color: var(--bg);\n    font-weight: 600;\n  }\n\n  /* card area */\n  .stage{\n    display:flex;\n    flex-direction: column;\n    align-items: center;\n    gap: 18px;\n  }\n\n  .progress-row{\n    width: 100%;\n    display:flex;\n    align-items:center;\n    gap: 12px;\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 12px;\n    color: var(--muted-2);\n  }\n\n  .progress-track{\n    flex:1;\n    height: 4px;\n    background: var(--line-soft);\n    border-radius: 4px;\n    overflow: hidden;\n  }\n  .progress-fill{\n    height:100%;\n    background: linear-gradient(90deg, var(--cyan-dim), var(--cyan));\n    width: 0%;\n    transition: width .25s ease;\n  }\n\n  .card-scene{\n    width: 100%;\n    max-width: 640px;\n    perspective: 1400px;\n  }\n\n  .card{\n    position: relative;\n    width: 100%;\n    min-height: 260px;\n    cursor: pointer;\n    transform-style: preserve-3d;\n    transition: transform .45s cubic-bezier(.4,.2,.2,1);\n  }\n\n  .card.flipped{ transform: rotateY(180deg); }\n\n  .face{\n    position:absolute;\n    inset:0;\n    backface-visibility: hidden;\n    border-radius: 12px;\n    border: 1px solid var(--line);\n    padding: 34px 32px;\n    display:flex;\n    flex-direction:column;\n    justify-content:center;\n    align-items:center;\n    text-align:center;\n    gap: 14px;\n  }\n\n  .face-front{\n    background: var(--panel);\n    box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset, 0 18px 40px -20px rgba(0,0,0,.6);\n  }\n\n  .face-back{\n    background: var(--card-back);\n    transform: rotateY(180deg);\n    border-color: var(--cyan-dim);\n  }\n\n  .face-label{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 10.5px;\n    letter-spacing: 1.5px;\n    color: var(--muted-2);\n  }\n\n  .term{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: clamp(19px, 3.4vw, 26px);\n    font-weight: 600;\n    color: var(--cyan);\n    line-height: 1.35;\n  }\n\n  .definition{\n    font-size: 16.5px;\n    line-height: 1.55;\n    color: var(--text);\n    max-width: 480px;\n  }\n\n  .hint{\n    position:absolute;\n    bottom: 14px;\n    font-size: 11px;\n    color: var(--muted-2);\n    font-family:'IBM Plex Mono', monospace;\n  }\n\n  .controls{\n    display:flex;\n    align-items:center;\n    gap: 10px;\n    margin-top: 4px;\n  }\n\n  .ctrl-btn{\n    background: var(--panel);\n    border: 1px solid var(--line);\n    color: var(--text);\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 13px;\n    padding: 10px 16px;\n    border-radius: 8px;\n    cursor: pointer;\n    display:flex;\n    align-items:center;\n    gap: 6px;\n    transition: border-color .15s ease, transform .1s ease;\n  }\n\n  .ctrl-btn:hover{ border-color: var(--cyan-dim); }\n  .ctrl-btn:active{ transform: scale(0.97); }\n\n  .ctrl-btn.primary{\n    background: var(--cyan);\n    color: var(--bg);\n    border-color: var(--cyan);\n    font-weight: 600;\n  }\n  .ctrl-btn.primary:hover{ opacity: .9; }\n\n  .ctrl-btn.ghost{ color: var(--muted); }\n\n  .ctrl-btn svg{ width: 14px; height:14px; }\n\n  .kbd-hint{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 11px;\n    color: var(--muted-2);\n    margin-top: 2px;\n  }\n  .kbd-hint kbd{\n    border: 1px solid var(--line);\n    border-radius: 4px;\n    padding: 1px 5px;\n    font-family: inherit;\n    color: var(--muted);\n  }\n\n  footer{\n    text-align:center;\n    margin-top: 44px;\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 11.5px;\n    color: var(--muted-2);\n  }\n\n  @media (max-width: 520px){\n    .face{ padding: 26px 20px; }\n    header{ flex-direction: column; align-items:flex-start; }\n    .stat{ text-align:left; }\n  }\n\n  @media (prefers-reduced-motion: reduce){\n    .card, .progress-fill{ transition: none; }\n  }\n<\/style>\n<\/head>\n<body>\n\n<div class=\"wrap\">\n\n  <header>\n    <div>\n      <div class=\"brand\"><span class=\"dot\"><\/span><h1>APPDEV — Final Exam Reviewer<\/h1><\/div>\n      <div class=\"subtitle\">Test I: Multiple Choice · Test II: True or False<\/div>\n    <\/div>\n    <div class=\"stat\">\n      <div><b id=\"totalCount\">0<\/b> terms loaded<\/div>\n      <div id=\"moduleLabel\">Test I: Multiple Choice<\/div>\n    <\/div>\n  <\/header>\n\n  <div class=\"modules\" id=\"moduleTabs\"><\/div>\n\n  <div class=\"mode-row\">\n    <span class=\"mode-label\">Show first:<\/span>\n    <div class=\"mode-toggle\" id=\"modeToggle\">\n      <button class=\"mode-opt\" data-mode=\"term\">Term<\/button>\n      <button class=\"mode-opt active\" data-mode=\"def\">Definition<\/button>\n    <\/div>\n  <\/div>\n\n  <div class=\"stage\">\n    <div class=\"progress-row\">\n      <span id=\"cardPos\">1 / 30<\/span>\n      <div class=\"progress-track\"><div class=\"progress-fill\" id=\"progressFill\"><\/div><\/div>\n      <span id=\"flipState\">tap to flip<\/span>\n    <\/div>\n\n    <div class=\"card-scene\">\n      <div class=\"card\" id=\"card\">\n        <div class=\"face face-front\">\n          <span class=\"face-label\" id=\"frontLabel\">TERM<\/span>\n          <div class=\"term\" id=\"frontText\"><\/div>\n          <span class=\"hint\">click card / press space<\/span>\n        <\/div>\n        <div class=\"face face-back\">\n          <span class=\"face-label\" id=\"backLabel\" style=\"color:var(--cyan)\">DEFINITION<\/span>\n          <div class=\"definition\" id=\"backText\"><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"controls\">\n      <button class=\"ctrl-btn ghost\" id=\"prevBtn\" title=\"Previous (←)\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M15 18l-6-6 6-6\"/><\/svg>\n        Prev\n      <\/button>\n      <button class=\"ctrl-btn primary\" id=\"flipBtn\">Flip card<\/button>\n      <button class=\"ctrl-btn ghost\" id=\"nextBtn\" title=\"Next (→)\">\n        Next\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M9 18l6-6-6-6\"/><\/svg>\n      <\/button>\n    <\/div>\n    <div class=\"controls\">\n      <button class=\"ctrl-btn\" id=\"shuffleBtn\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5\"/><\/svg>\n        Shuffle module\n      <\/button>\n      <button class=\"ctrl-btn\" id=\"restartBtn\">Restart order<\/button>\n    <\/div>\n    <div class=\"kbd-hint\"><kbd>←<\/kbd> <kbd>→<\/kbd> navigate &nbsp; <kbd>space<\/kbd> flip &nbsp; <kbd>S<\/kbd> shuffle<\/div>\n  <\/div>\n\n  <footer>Source: APPDEV final exam reviewer<\/footer>\n<\/div>\n\n<script>\nconst DATA = [\n {\n  \"module\": \"Test I: Multiple Choice\",\n  \"short\": \"Multiple Choice\",\n  \"terms\": [\n   [\n    \"Spinner\",\n    \"Which input control is used to choose from a dropdown list?\"\n   ],\n   [\n    \"View\",\n    \"What is responsible for drawing and event handling?\"\n   ],\n   [\n    \"onPause()\",\n    \"Which method is triggered when another activity appears in front of the current one?\"\n   ],\n   [\n    \"Status Bar\",\n    \"Which part of Android Studio shows the status of the IDE?\"\n   ],\n   [\n    \"More efficient because it recycles item views\",\n    \"RecyclerView is preferred over ListView because it is:\"\n   ],\n   [\n    \"ListView\",\n    \"Which View displays scrollable lists of items?\"\n   ],\n   [\n    \"WebView\",\n    \"Which layout is used to display web content?\"\n   ],\n   [\n    \"onClick()\",\n    \"Which event listener triggers on a simple click?\"\n   ],\n   [\n    \"BroadcastReceiver\",\n    \"Which component responds to system-wide broadcast messages (e.g., low battery)?\"\n   ],\n   [\n    \"onCreate(), onStart(), and onResume()\",\n    \"Which lifecycle methods are called when an app first opens?\"\n   ],\n   [\n    \"RelativeLayout\",\n    \"Which layout positions elements relative to each other?\"\n   ],\n   [\n    \"Content Provider\",\n    \"Which component shares data between applications?\"\n   ],\n   [\n    \"EditText\",\n    \"Which View allows the user to enter text input?\"\n   ],\n   [\n    \"Keyboard or physical navigation controls\",\n    \"Touch mode allows interaction without needing:\"\n   ],\n   [\n    \"FrameLayout\",\n    \"Which layout stacks views on top of each other?\"\n   ],\n   [\n    \"LinearLayout\",\n    \"Which layout arranges elements horizontally or vertically?\"\n   ],\n   [\n    \"onClick()\",\n    \"Which event handler is used with OnClickListener?\"\n   ],\n   [\n    \"Activity\",\n    \"Which Android component represents a single screen with a user interface?\"\n   ],\n   [\n    \"onCreate()\",\n    \"Which lifecycle method is called first when an Activity is created?\"\n   ],\n   [\n    \"Notification\",\n    \"Which component alerts the user when the app is not visible?\"\n   ],\n   [\n    \"res/layout\",\n    \"Which folder in a project contains XML layout files?\"\n   ],\n   [\n    \"Long Click (onLongClick)\",\n    \"Which event occurs when holding a widget for 1 second or more?\"\n   ],\n   [\n    \"AutoCompleteTextView\",\n    \"Which is an example of a hybrid widget?\"\n   ],\n   [\n    \"Switch\",\n    \"Which control is used to toggle settings ON/OFF?\"\n   ],\n   [\n    \"Communication between components and navigating between Activities\",\n    \"Intents are used for:\"\n   ],\n   [\n    \"Android Studio\",\n    \"Which Android tool is the official IDE for app development?\"\n   ],\n   [\n    \"ProgressBar\",\n    \"Which control visually shows progress of a task?\"\n   ],\n   [\n    \"onStart()\",\n    \"Which callback method is invoked when the activity becomes visible but not yet interactive?\"\n   ],\n   [\n    \"Authentication (password recovery)\",\n    \"Forgot password is part of:\"\n   ],\n   [\n    \"Service\",\n    \"Which Android component runs in the background performing long-running tasks?\"\n   ]\n  ]\n },\n {\n  \"module\": \"Test II: True or False\",\n  \"short\": \"True or False\",\n  \"terms\": [\n   [\n    \"A — TRUE\",\n    \"An Activity represents one screen of an Android app.\"\n   ],\n   [\n    \"A — TRUE\",\n    \"onTouch() handles movement gestures or press-release actions.\"\n   ],\n   [\n    \"A — TRUE\",\n    \"A Service can run in the background even if the user is using another app.\"\n   ],\n   [\n    \"A — TRUE\",\n    \"EditText is used for inputting text.\"\n   ],\n   [\n    \"B — FALSE\",\n    \"RelativeLayout arranges items in rows and columns.\"\n   ],\n   [\n    \"B — FALSE\",\n    \"Touch mode requires focusing on a widget before interacting.\"\n   ],\n   [\n    \"A — TRUE\",\n    \"Event handlers perform the action in response to an event.\"\n   ],\n   [\n    \"A — TRUE\",\n    \"Content Providers manage access to shared application data.\"\n   ],\n   [\n    \"B — FALSE\",\n    \"onClickListener triggers after a long press.\"\n   ],\n   [\n    \"A — TRUE\",\n    \"createUserWithEmailAndPassword() is used for user registration.\"\n   ],\n   [\n    \"B — FALSE\",\n    \"The res folder contains Java source files.\"\n   ],\n   [\n    \"A — TRUE\",\n    \"A TextView is used for displaying text to the user.\"\n   ],\n   [\n    \"A — TRUE\",\n    \"LinearLayout arranges views horizontally or vertically.\"\n   ],\n   [\n    \"A — TRUE\",\n    \"Intents can be used to move from one Activity to another.\"\n   ],\n   [\n    \"A — TRUE\",\n    \"FrameLayout places views on top of each other.\"\n   ],\n   [\n    \"A — TRUE\",\n    \"RecyclerView is more flexible than ListView.\"\n   ],\n   [\n    \"A — TRUE\",\n    \"Android Studio is based on IntelliJ IDEA.\"\n   ],\n   [\n    \"B — FALSE\",\n    \"onDestroy() is always called when the user closes an app.\"\n   ],\n   [\n    \"B — FALSE\",\n    \"Firebase Authentication is mainly used for UI animations.\"\n   ],\n   [\n    \"A — TRUE\",\n    \"signInWithEmailAndPassword() handles user login.\"\n   ]\n  ]\n }\n];\n\nlet currentModule = 0;\nlet order = [];\nlet currentIndex = 0;\nlet flipped = false;\nlet mode = 'def'; // 'term' = term shown first, 'def' = definition shown first\n\nconst moduleTabsEl = document.getElementById('moduleTabs');\nconst frontText = document.getElementById('frontText');\nconst backText = document.getElementById('backText');\nconst frontLabel = document.getElementById('frontLabel');\nconst backLabel = document.getElementById('backLabel');\nconst cardEl = document.getElementById('card');\nconst cardPos = document.getElementById('cardPos');\nconst progressFill = document.getElementById('progressFill');\nconst moduleLabel = document.getElementById('moduleLabel');\nconst totalCount = document.getElementById('totalCount');\nconst flipState = document.getElementById('flipState');\n\nfunction shortModuleLabel(name){\n  return name.split('—')[0].trim();\n}\n\nfunction buildTabs(){\n  moduleTabsEl.innerHTML = '';\n  DATA.forEach((mod, i) => {\n    const btn = document.createElement('button');\n    btn.className = 'mod-btn' + (i === currentModule ? ' active' : '');\n    btn.title = mod.module;\n    btn.innerHTML = mod.short + '<span class=\"count\">' + mod.terms.length + '<\/span>';\n    btn.addEventListener('click', () => selectModule(i));\n    moduleTabsEl.appendChild(btn);\n  });\n}\n\nfunction selectModule(i){\n  currentModule = i;\n  order = DATA[i].terms.map((_, idx) => idx);\n  currentIndex = 0;\n  flipped = false;\n  buildTabs();\n  render();\n}\n\nfunction render(){\n  const mod = DATA[currentModule];\n  const termIndex = order[currentIndex];\n  const [term, def] = mod.terms[termIndex];\n\n  if(mode === 'term'){\n    frontLabel.textContent = 'TERM';\n    backLabel.textContent = 'DEFINITION';\n    frontText.textContent = term;\n    backText.textContent = def;\n    frontText.className = 'term';\n    backText.className = 'definition';\n  } else {\n    frontLabel.textContent = 'DEFINITION';\n    backLabel.textContent = 'TERM';\n    frontText.textContent = def;\n    backText.textContent = term;\n    frontText.className = 'definition';\n    backText.className = 'term';\n  }\n\n  [frontText, backText].forEach(el => { el.style.fontSize = (el.className === 'term' && el.textContent.length > 38) ? 'clamp(16px, 2.6vw, 20px)' : ''; });\n  cardEl.classList.toggle('flipped', flipped);\n  flipState.textContent = flipped ? ('showing ' + (mode === 'term' ? 'definition' : 'term')) : 'tap to flip';\n  cardPos.textContent = (currentIndex + 1) + ' / ' + mod.terms.length;\n  progressFill.style.width = (((currentIndex + 1) / mod.terms.length) * 100) + '%';\n  moduleLabel.textContent = mod.module;\n  totalCount.textContent = DATA.reduce((sum, m) => sum + m.terms.length, 0);\n}\n\nfunction setMode(newMode){\n  mode = newMode;\n  flipped = false;\n  document.querySelectorAll('.mode-opt').forEach(btn => {\n    btn.classList.toggle('active', btn.dataset.mode === newMode);\n  });\n  render();\n}\n\nfunction flip(){\n  flipped = !flipped;\n  cardEl.classList.toggle('flipped', flipped);\n  flipState.textContent = flipped ? 'showing definition' : 'tap to flip';\n}\n\nfunction next(){\n  currentIndex = (currentIndex + 1) % order.length;\n  flipped = false;\n  render();\n}\n\nfunction prev(){\n  currentIndex = (currentIndex - 1 + order.length) % order.length;\n  flipped = false;\n  render();\n}\n\nfunction shuffleModule(){\n  for(let i = order.length - 1; i > 0; i--){\n    const j = Math.floor(Math.random() * (i + 1));\n    [order[i], order[j]] = [order[j], order[i]];\n  }\n  currentIndex = 0;\n  flipped = false;\n  render();\n}\n\nfunction restartOrder(){\n  order = DATA[currentModule].terms.map((_, idx) => idx);\n  currentIndex = 0;\n  flipped = false;\n  render();\n}\n\ndocument.querySelectorAll('.mode-opt').forEach(btn => {\n  btn.addEventListener('click', () => setMode(btn.dataset.mode));\n});\n\ncardEl.addEventListener('click', flip);\ndocument.getElementById('flipBtn').addEventListener('click', flip);\ndocument.getElementById('nextBtn').addEventListener('click', next);\ndocument.getElementById('prevBtn').addEventListener('click', prev);\ndocument.getElementById('shuffleBtn').addEventListener('click', shuffleModule);\ndocument.getElementById('restartBtn').addEventListener('click', restartOrder);\n\ndocument.addEventListener('keydown', (e) => {\n  if(e.code === 'Space'){ e.preventDefault(); flip(); }\n  else if(e.code === 'ArrowRight'){ next(); }\n  else if(e.code === 'ArrowLeft'){ prev(); }\n  else if(e.code === 'KeyS'){ shuffleModule(); }\n});\n\nbuildTabs();\nselectModule(0);\n<\/script>\n\n<\/body>\n<\/html>\n"}, {"id": "ebp", "title": "EBP · Modules 1–5", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>EBP — Flashcard Reviewer<\/title>\n<style>\n  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');\n\n  :root{\n    --bg: #0d1624;\n    --panel: #14213a;\n    --panel-2: #182945;\n    --line: #26406b;\n    --line-soft: #1a2c4a;\n    --text: #e8eef9;\n    --muted: #93a8c9;\n    --muted-2: #5f759b;\n    --cyan: #6aa8ff;\n    --cyan-dim: #2f5fa8;\n    --amber: #9cc4ff;\n    --amber-dim: #2f4f80;\n    --card-back: #0f1a2e;\n  }\n\n  *{ box-sizing: border-box; }\n\n  html,body{\n    margin:0; padding:0;\n    background: var(--bg);\n    color: var(--text);\n    font-family: 'Inter', sans-serif;\n    min-height: 100vh;\n  }\n\n  body{\n    background-image:\n      linear-gradient(var(--line-soft) 1px, transparent 1px),\n      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);\n    background-size: 48px 48px;\n    background-position: -1px -1px;\n    background-attachment: fixed;\n  }\n\n  .wrap{\n    max-width: 860px;\n    margin: 0 auto;\n    padding: 36px 20px 80px;\n  }\n\n  header{\n    display:flex;\n    align-items: baseline;\n    justify-content: space-between;\n    gap: 16px;\n    margin-bottom: 28px;\n    flex-wrap: wrap;\n    border-bottom: 1px solid var(--line);\n    padding-bottom: 18px;\n  }\n\n  .brand{\n    display:flex;\n    align-items:baseline;\n    gap: 10px;\n  }\n\n  .brand .dot{\n    width: 9px; height:9px;\n    border-radius: 50%;\n    background: var(--cyan);\n    box-shadow: 0 0 8px var(--cyan);\n    display:inline-block;\n    transform: translateY(-2px);\n  }\n\n  h1{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 20px;\n    font-weight: 600;\n    margin: 0;\n    letter-spacing: 0.2px;\n  }\n\n  .subtitle{\n    font-size: 13px;\n    color: var(--muted);\n    font-family:'IBM Plex Mono', monospace;\n  }\n\n  .stat{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 12.5px;\n    color: var(--muted);\n    text-align: right;\n  }\n\n  .stat b{ color: var(--cyan); font-weight:600; }\n\n  /* module tabs */\n  .modules{\n    display:flex;\n    flex-wrap: wrap;\n    gap: 8px;\n    margin-bottom: 26px;\n  }\n\n  .mod-btn{\n    background: var(--panel);\n    border: 1px solid var(--line);\n    color: var(--muted);\n    font-family: 'IBM Plex Mono', monospace;\n    font-size: 12.5px;\n    padding: 8px 12px;\n    border-radius: 7px;\n    cursor: pointer;\n    transition: border-color .15s ease, color .15s ease, background .15s ease;\n    line-height: 1.3;\n  }\n\n  .mod-btn:hover{ border-color: var(--cyan-dim); color: var(--text); }\n\n  .mod-btn.active{\n    border-color: var(--cyan);\n    color: var(--bg);\n    background: var(--cyan);\n    font-weight: 600;\n  }\n\n  .mod-btn .count{\n    opacity: .65;\n    margin-left: 4px;\n  }\n  .mod-btn.active .count{ opacity:.55; }\n\n  /* front-side mode toggle */\n  .mode-row{\n    display:flex;\n    align-items:center;\n    gap: 10px;\n    margin-bottom: 22px;\n  }\n\n  .mode-label{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 12px;\n    color: var(--muted-2);\n  }\n\n  .mode-toggle{\n    display:inline-flex;\n    background: var(--panel);\n    border: 1px solid var(--line);\n    border-radius: 8px;\n    padding: 3px;\n    gap: 3px;\n  }\n\n  .mode-opt{\n    background: transparent;\n    border: none;\n    color: var(--muted);\n    font-family: 'IBM Plex Mono', monospace;\n    font-size: 12px;\n    padding: 6px 12px;\n    border-radius: 6px;\n    cursor: pointer;\n    transition: background .15s ease, color .15s ease;\n  }\n\n  .mode-opt:hover{ color: var(--text); }\n\n  .mode-opt.active{\n    background: var(--cyan);\n    color: var(--bg);\n    font-weight: 600;\n  }\n\n  /* card area */\n  .stage{\n    display:flex;\n    flex-direction: column;\n    align-items: center;\n    gap: 18px;\n  }\n\n  .progress-row{\n    width: 100%;\n    display:flex;\n    align-items:center;\n    gap: 12px;\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 12px;\n    color: var(--muted-2);\n  }\n\n  .progress-track{\n    flex:1;\n    height: 4px;\n    background: var(--line-soft);\n    border-radius: 4px;\n    overflow: hidden;\n  }\n  .progress-fill{\n    height:100%;\n    background: linear-gradient(90deg, var(--cyan-dim), var(--cyan));\n    width: 0%;\n    transition: width .25s ease;\n  }\n\n  .card-scene{\n    width: 100%;\n    max-width: 640px;\n    perspective: 1400px;\n  }\n\n  .card{\n    position: relative;\n    width: 100%;\n    min-height: 260px;\n    cursor: pointer;\n    transform-style: preserve-3d;\n    transition: transform .45s cubic-bezier(.4,.2,.2,1);\n  }\n\n  .card.flipped{ transform: rotateY(180deg); }\n\n  .face{\n    position:absolute;\n    inset:0;\n    backface-visibility: hidden;\n    border-radius: 12px;\n    border: 1px solid var(--line);\n    padding: 34px 32px;\n    display:flex;\n    flex-direction:column;\n    justify-content:center;\n    align-items:center;\n    text-align:center;\n    gap: 14px;\n  }\n\n  .face-front{\n    background: var(--panel);\n    box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset, 0 18px 40px -20px rgba(0,0,0,.6);\n  }\n\n  .face-back{\n    background: var(--card-back);\n    transform: rotateY(180deg);\n    border-color: var(--cyan-dim);\n  }\n\n  .face-label{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 10.5px;\n    letter-spacing: 1.5px;\n    color: var(--muted-2);\n  }\n\n  .term{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: clamp(19px, 3.4vw, 26px);\n    font-weight: 600;\n    color: var(--cyan);\n    line-height: 1.35;\n  }\n\n  .definition{\n    font-size: 16.5px;\n    line-height: 1.55;\n    color: var(--text);\n    max-width: 480px;\n  }\n\n  .hint{\n    position:absolute;\n    bottom: 14px;\n    font-size: 11px;\n    color: var(--muted-2);\n    font-family:'IBM Plex Mono', monospace;\n  }\n\n  .controls{\n    display:flex;\n    align-items:center;\n    gap: 10px;\n    margin-top: 4px;\n  }\n\n  .ctrl-btn{\n    background: var(--panel);\n    border: 1px solid var(--line);\n    color: var(--text);\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 13px;\n    padding: 10px 16px;\n    border-radius: 8px;\n    cursor: pointer;\n    display:flex;\n    align-items:center;\n    gap: 6px;\n    transition: border-color .15s ease, transform .1s ease;\n  }\n\n  .ctrl-btn:hover{ border-color: var(--cyan-dim); }\n  .ctrl-btn:active{ transform: scale(0.97); }\n\n  .ctrl-btn.primary{\n    background: var(--cyan);\n    color: var(--bg);\n    border-color: var(--cyan);\n    font-weight: 600;\n  }\n  .ctrl-btn.primary:hover{ opacity: .9; }\n\n  .ctrl-btn.ghost{ color: var(--muted); }\n\n  .ctrl-btn svg{ width: 14px; height:14px; }\n\n  .kbd-hint{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 11px;\n    color: var(--muted-2);\n    margin-top: 2px;\n  }\n  .kbd-hint kbd{\n    border: 1px solid var(--line);\n    border-radius: 4px;\n    padding: 1px 5px;\n    font-family: inherit;\n    color: var(--muted);\n  }\n\n  footer{\n    text-align:center;\n    margin-top: 44px;\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 11.5px;\n    color: var(--muted-2);\n  }\n\n  @media (max-width: 520px){\n    .face{ padding: 26px 20px; }\n    header{ flex-direction: column; align-items:flex-start; }\n    .stat{ text-align:left; }\n  }\n\n  @media (prefers-reduced-motion: reduce){\n    .card, .progress-fill{ transition: none; }\n  }\n<\/style>\n<\/head>\n<body>\n\n<div class=\"wrap\">\n\n  <header>\n    <div>\n      <div class=\"brand\"><span class=\"dot\"><\/span><h1>EBP — Flashcards<\/h1><\/div>\n      <div class=\"subtitle\">opportunity assessment · strategy · storytelling · pitching · operations &amp; IP<\/div>\n    <\/div>\n    <div class=\"stat\">\n      <div><b id=\"totalCount\">0<\/b> terms loaded<\/div>\n      <div id=\"moduleLabel\">Module 1: Foundational Concepts & Opportunity Assessment<\/div>\n    <\/div>\n  <\/header>\n\n  <div class=\"modules\" id=\"moduleTabs\"><\/div>\n\n  <div class=\"mode-row\">\n    <span class=\"mode-label\">Show first:<\/span>\n    <div class=\"mode-toggle\" id=\"modeToggle\">\n      <button class=\"mode-opt active\" data-mode=\"term\">Term<\/button>\n      <button class=\"mode-opt\" data-mode=\"def\">Definition<\/button>\n    <\/div>\n  <\/div>\n\n  <div class=\"stage\">\n    <div class=\"progress-row\">\n      <span id=\"cardPos\">1 / 12<\/span>\n      <div class=\"progress-track\"><div class=\"progress-fill\" id=\"progressFill\"><\/div><\/div>\n      <span id=\"flipState\">tap to flip<\/span>\n    <\/div>\n\n    <div class=\"card-scene\">\n      <div class=\"card\" id=\"card\">\n        <div class=\"face face-front\">\n          <span class=\"face-label\" id=\"frontLabel\">TERM<\/span>\n          <div class=\"term\" id=\"frontText\"><\/div>\n          <span class=\"hint\">click card / press space<\/span>\n        <\/div>\n        <div class=\"face face-back\">\n          <span class=\"face-label\" id=\"backLabel\" style=\"color:var(--cyan)\">DEFINITION<\/span>\n          <div class=\"definition\" id=\"backText\"><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"controls\">\n      <button class=\"ctrl-btn ghost\" id=\"prevBtn\" title=\"Previous (←)\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M15 18l-6-6 6-6\"/><\/svg>\n        Prev\n      <\/button>\n      <button class=\"ctrl-btn primary\" id=\"flipBtn\">Flip card<\/button>\n      <button class=\"ctrl-btn ghost\" id=\"nextBtn\" title=\"Next (→)\">\n        Next\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M9 18l6-6-6-6\"/><\/svg>\n      <\/button>\n    <\/div>\n    <div class=\"controls\">\n      <button class=\"ctrl-btn\" id=\"shuffleBtn\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5\"/><\/svg>\n        Shuffle module\n      <\/button>\n      <button class=\"ctrl-btn\" id=\"restartBtn\">Restart order<\/button>\n    <\/div>\n    <div class=\"kbd-hint\"><kbd>←<\/kbd> <kbd>→<\/kbd> navigate &nbsp; <kbd>space<\/kbd> flip &nbsp; <kbd>S<\/kbd> shuffle<\/div>\n  <\/div>\n\n  <footer>Source: EBP reviewer — Modules 1–5<\/footer>\n<\/div>\n\n<script>\nconst DATA = [\n {\n  \"module\": \"Module 1: Foundational Concepts & Opportunity Assessment\",\n  \"short\": \"Module 1\",\n  \"terms\": [\n   [\n    \"Opportunity screening\",\n    \"The process of evaluating innovative product ideas, strategies, and marketing trends to determine potential success.\"\n   ],\n   [\n    \"PEST analysis\",\n    \"Identifies political, economic, societal, and technological factors that create opportunities and threats.\"\n   ],\n   [\n    \"Secondary research\",\n    \"Uses data already available through published sources, articles, or reports.\"\n   ],\n   [\n    \"Primary data\",\n    \"Directly gathers feedback from consumers using survey questionnaires or customer comment cards.\"\n   ],\n   [\n    \"Quantitative data\",\n    \"Consists of numerical measurements (e.g., purchase stats).\"\n   ],\n   [\n    \"Qualitative data\",\n    \"Answers \\\"why\\\" and \\\"how\\\" (e.g., interview explanations).\"\n   ],\n   [\n    \"Processing Feedback\",\n    \"Prioritize refining product-market fit by isolating data points from quantitative and qualitative feedback, prioritizing affordable popular features, and adjusting product scope accordingly.\"\n   ],\n   [\n    \"PRIZM\",\n    \"Analyzes U.S. Census data by characterizing it according to specific lifestyle traits and socioeconomic rank down to the neighborhood level.\"\n   ],\n   [\n    \"Competitive analysis grid\",\n    \"Assesses key competitor success factors, strengths, and weaknesses in a local market.\"\n   ],\n   [\n    \"Substitute products\",\n    \"When entering an entirely new market, competitive analysis must focus on substitute products rather than direct competitors.\"\n   ],\n   [\n    \"Three Circles Tool\",\n    \"The intersection of company offerings, customer needs, and competitor offerings represents value parity.\"\n   ],\n   [\n    \"Business Model Core\",\n    \"A plan detailing how products are made, distributed, funded, and turned into profit.\"\n   ]\n  ]\n },\n {\n  \"module\": \"Module 2: Strategy, Vision, Mission & Target Setting\",\n  \"short\": \"Module 2\",\n  \"terms\": [\n   [\n    \"Vision Statement\",\n    \"Outlines the venture’s broader purpose and what it aspires to become in the future (broad and future-oriented).\"\n   ],\n   [\n    \"Mission Statement\",\n    \"More specific than a vision statement; it defines who the organization is, what it does, and its primary long-term goals and market purpose without limiting innovation.\"\n   ],\n   [\n    \"SMART Goal\",\n    \"An objective that is specific, measurable, achievable, relevant, and timely.\"\n   ]\n  ]\n },\n {\n  \"module\": \"Module 3: Corporate Narratives & Brand Storytelling\",\n  \"short\": \"Module 3\",\n  \"terms\": [\n   [\n    \"The Entrepreneur's Journey\",\n    \"Often compared to a fairy tale (a universal storytelling format moving from problem to ingenious solution).\"\n   ],\n   [\n    \"Corporate narrative\",\n    \"The bigger story of how a successful company grew from something small (recalling humble beginnings) to remind leaders and employees of founder dreams.\"\n   ],\n   [\n    \"Personal Narrative\",\n    \"Founders should formulate a balanced story that acknowledges early challenges and perseverance rather than portraying effortless success. Focusing too heavily on a heroic startup story risks missing important market challenges or deep-seated design flaws.\"\n   ],\n   [\n    \"Narrative Strategies\",\n    \"Connecting brand advocates to emotional legacies (like great athletes) conveys brand value through loyal customer perspectives. However, strategies inducing \\\"fear of missing out\\\" (FOMO) are ethically criticized for manufacturing need and clouding people's sense of what is important.\"\n   ]\n  ]\n },\n {\n  \"module\": \"Module 4: Pitching Dynamics, Competitions & Investor Relations\",\n  \"short\": \"Module 4\",\n  \"terms\": [\n   [\n    \"Pitch Deck Elements\",\n    \"The maximum recommended number of slides is 10.\"\n   ],\n   [\n    \"Core market viability\",\n    \"Investor confidence in market demand and viable financial returns.\"\n   ],\n   [\n    \"\\\"Ask\\\" slide\",\n    \"For angel investors must specify the exact amount of capital needed, how funds will be used, and the expected return or milestone achievement.\"\n   ],\n   [\n    \"Elevator Pitch\",\n    \"An abbreviated, memorized talk designed to get you in the door to present a full pitch.\"\n   ],\n   [\n    \"3-sentence structure\",\n    \"Includes stating your name/target user, explaining the problem solution clearly, and closing with a request for a follow-up meeting.\"\n   ],\n   [\n    \"Friends & Family\",\n    \"Less formal; relies on personal reputation and emotional connection.\"\n   ],\n   [\n    \"Venture Capitalists / Angel Investors\",\n    \"Require rigorous market data, financial returns, and highlights on the team, product, and value proposition.\"\n   ],\n   [\n    \"Contests\",\n    \"Usually involve submitting documentation (business models).\"\n   ],\n   [\n    \"Pitch competitions\",\n    \"Require presenting a pitch deck or summary.\"\n   ],\n   [\n    \"Iceberg principle\",\n    \"Backing up every statement with thorough supporting research and details.\"\n   ],\n   [\n    \"Competition workflows\",\n    \"Require thoroughly reading rules, researching judges, tailoring the deck, aligning the ask precisely, and ensuring no discrepancies between submission and presentation.\"\n   ],\n   [\n    \"Joining Competitions\",\n    \"The top reason to join is finding a mentor (often a better predictor of long-term success than cash).\"\n   ],\n   [\n    \"Seed funding agreements\",\n    \"Always check the fine print on seed funding agreements regarding prizes, as some require signing over equity ownership that may conflict with long-term goals.\"\n   ],\n   [\n    \"Networking\",\n    \"Starting a new Collegiate Entrepreneurs' Organization (CEO) chapter involves consulting the Student Activities/Campus Life Office.\"\n   ]\n  ]\n },\n {\n  \"module\": \"Module 5: Operations, Asset Management & Intellectual Property\",\n  \"short\": \"Module 5\",\n  \"terms\": [\n   [\n    \"Asset Management\",\n    \"To prevent failure from overinvestment in fixed assets and poor inventory management, early startups should lease or purchase used equipment to save cash and maintain contingency funds.\"\n   ],\n   [\n    \"Noncompete agreement\",\n    \"Prevents employees from working for a competitor for a specified period. Useful for preventing corporate espionage by key insiders, but debatable/unfair to unnecessarily restrain low-level employees.\"\n   ],\n   [\n    \"Nondisclosure agreement (NDA)\",\n    \"Protects proprietary venture information by establishing clear penalties and time limits or open-ended secrecy requirements.\"\n   ],\n   [\n    \"Protecting Ideas\",\n    \"Protecting initial ideas is less critical than iterative versions and trade secrets because execution, know-how, and iterative learning matter more than raw concepts. Proprietary software features can also be protected via subterfuge (masking dormant capabilities in the user interface until launch).\"\n   ]\n  ]\n }\n];\n\nlet currentModule = 0;\nlet order = [];\nlet currentIndex = 0;\nlet flipped = false;\nlet mode = 'term'; // 'term' = term shown first, 'def' = definition shown first\n\nconst moduleTabsEl = document.getElementById('moduleTabs');\nconst frontText = document.getElementById('frontText');\nconst backText = document.getElementById('backText');\nconst frontLabel = document.getElementById('frontLabel');\nconst backLabel = document.getElementById('backLabel');\nconst cardEl = document.getElementById('card');\nconst cardPos = document.getElementById('cardPos');\nconst progressFill = document.getElementById('progressFill');\nconst moduleLabel = document.getElementById('moduleLabel');\nconst totalCount = document.getElementById('totalCount');\nconst flipState = document.getElementById('flipState');\n\nfunction shortModuleLabel(name){\n  return name.split('—')[0].trim();\n}\n\nfunction buildTabs(){\n  moduleTabsEl.innerHTML = '';\n  DATA.forEach((mod, i) => {\n    const btn = document.createElement('button');\n    btn.className = 'mod-btn' + (i === currentModule ? ' active' : '');\n    btn.title = mod.module;\n    btn.innerHTML = mod.short + '<span class=\"count\">' + mod.terms.length + '<\/span>';\n    btn.addEventListener('click', () => selectModule(i));\n    moduleTabsEl.appendChild(btn);\n  });\n}\n\nfunction selectModule(i){\n  currentModule = i;\n  order = DATA[i].terms.map((_, idx) => idx);\n  currentIndex = 0;\n  flipped = false;\n  buildTabs();\n  render();\n}\n\nfunction render(){\n  const mod = DATA[currentModule];\n  const termIndex = order[currentIndex];\n  const [term, def] = mod.terms[termIndex];\n\n  if(mode === 'term'){\n    frontLabel.textContent = 'TERM';\n    backLabel.textContent = 'DEFINITION';\n    frontText.textContent = term;\n    backText.textContent = def;\n    frontText.className = 'term';\n    backText.className = 'definition';\n  } else {\n    frontLabel.textContent = 'DEFINITION';\n    backLabel.textContent = 'TERM';\n    frontText.textContent = def;\n    backText.textContent = term;\n    frontText.className = 'definition';\n    backText.className = 'term';\n  }\n\n  [frontText, backText].forEach(el => { el.style.fontSize = (el.className === 'term' && el.textContent.length > 38) ? 'clamp(16px, 2.6vw, 20px)' : ''; });\n  cardEl.classList.toggle('flipped', flipped);\n  flipState.textContent = flipped ? ('showing ' + (mode === 'term' ? 'definition' : 'term')) : 'tap to flip';\n  cardPos.textContent = (currentIndex + 1) + ' / ' + mod.terms.length;\n  progressFill.style.width = (((currentIndex + 1) / mod.terms.length) * 100) + '%';\n  moduleLabel.textContent = mod.module;\n  totalCount.textContent = DATA.reduce((sum, m) => sum + m.terms.length, 0);\n}\n\nfunction setMode(newMode){\n  mode = newMode;\n  flipped = false;\n  document.querySelectorAll('.mode-opt').forEach(btn => {\n    btn.classList.toggle('active', btn.dataset.mode === newMode);\n  });\n  render();\n}\n\nfunction flip(){\n  flipped = !flipped;\n  cardEl.classList.toggle('flipped', flipped);\n  flipState.textContent = flipped ? 'showing definition' : 'tap to flip';\n}\n\nfunction next(){\n  currentIndex = (currentIndex + 1) % order.length;\n  flipped = false;\n  render();\n}\n\nfunction prev(){\n  currentIndex = (currentIndex - 1 + order.length) % order.length;\n  flipped = false;\n  render();\n}\n\nfunction shuffleModule(){\n  for(let i = order.length - 1; i > 0; i--){\n    const j = Math.floor(Math.random() * (i + 1));\n    [order[i], order[j]] = [order[j], order[i]];\n  }\n  currentIndex = 0;\n  flipped = false;\n  render();\n}\n\nfunction restartOrder(){\n  order = DATA[currentModule].terms.map((_, idx) => idx);\n  currentIndex = 0;\n  flipped = false;\n  render();\n}\n\ndocument.querySelectorAll('.mode-opt').forEach(btn => {\n  btn.addEventListener('click', () => setMode(btn.dataset.mode));\n});\n\ncardEl.addEventListener('click', flip);\ndocument.getElementById('flipBtn').addEventListener('click', flip);\ndocument.getElementById('nextBtn').addEventListener('click', next);\ndocument.getElementById('prevBtn').addEventListener('click', prev);\ndocument.getElementById('shuffleBtn').addEventListener('click', shuffleModule);\ndocument.getElementById('restartBtn').addEventListener('click', restartOrder);\n\ndocument.addEventListener('keydown', (e) => {\n  if(e.code === 'Space'){ e.preventDefault(); flip(); }\n  else if(e.code === 'ArrowRight'){ next(); }\n  else if(e.code === 'ArrowLeft'){ prev(); }\n  else if(e.code === 'KeyS'){ shuffleModule(); }\n});\n\nbuildTabs();\nselectModule(0);\n<\/script>\n\n<\/body>\n<\/html>\n"}, {"id": "isr-chapters", "title": "ISR · Chapters 1 & 2", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ISR Chapters 1 &amp; 2 — Flashcard Reviewer<\/title>\n<style>\n  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');\n\n  :root{\n    --bg: #1b130d;\n    --panel: #271b13;\n    --panel-2: #2e2017;\n    --line: #4d382a;\n    --line-soft: #352619;\n    --text: #f4eadf;\n    --muted: #bfa48c;\n    --muted-2: #8c7059;\n    --cyan: #dba46b;\n    --cyan-dim: #94612f;\n    --amber: #e6c08a;\n    --amber-dim: #6b4a24;\n    --card-back: #21160f;\n  }\n\n  *{ box-sizing: border-box; }\n\n  html,body{\n    margin:0; padding:0;\n    background: var(--bg);\n    color: var(--text);\n    font-family: 'Inter', sans-serif;\n    min-height: 100vh;\n  }\n\n  body{\n    background-image:\n      linear-gradient(var(--line-soft) 1px, transparent 1px),\n      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);\n    background-size: 48px 48px;\n    background-position: -1px -1px;\n    background-attachment: fixed;\n  }\n\n  .wrap{\n    max-width: 860px;\n    margin: 0 auto;\n    padding: 36px 20px 80px;\n  }\n\n  header{\n    display:flex;\n    align-items: baseline;\n    justify-content: space-between;\n    gap: 16px;\n    margin-bottom: 28px;\n    flex-wrap: wrap;\n    border-bottom: 1px solid var(--line);\n    padding-bottom: 18px;\n  }\n\n  .brand{\n    display:flex;\n    align-items:baseline;\n    gap: 10px;\n  }\n\n  .brand .dot{\n    width: 9px; height:9px;\n    border-radius: 50%;\n    background: var(--cyan);\n    box-shadow: 0 0 8px var(--cyan);\n    display:inline-block;\n    transform: translateY(-2px);\n  }\n\n  h1{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 20px;\n    font-weight: 600;\n    margin: 0;\n    letter-spacing: 0.2px;\n  }\n\n  .subtitle{\n    font-size: 13px;\n    color: var(--muted);\n    font-family:'IBM Plex Mono', monospace;\n  }\n\n  .stat{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 12.5px;\n    color: var(--muted);\n    text-align: right;\n  }\n\n  .stat b{ color: var(--cyan); font-weight:600; }\n\n  /* module tabs */\n  .modules{\n    display:flex;\n    flex-wrap: wrap;\n    gap: 8px;\n    margin-bottom: 26px;\n  }\n\n  .mod-btn{\n    background: var(--panel);\n    border: 1px solid var(--line);\n    color: var(--muted);\n    font-family: 'IBM Plex Mono', monospace;\n    font-size: 12.5px;\n    padding: 8px 12px;\n    border-radius: 7px;\n    cursor: pointer;\n    transition: border-color .15s ease, color .15s ease, background .15s ease;\n    line-height: 1.3;\n  }\n\n  .mod-btn:hover{ border-color: var(--cyan-dim); color: var(--text); }\n\n  .mod-btn.active{\n    border-color: var(--cyan);\n    color: var(--bg);\n    background: var(--cyan);\n    font-weight: 600;\n  }\n\n  .mod-btn .count{\n    opacity: .65;\n    margin-left: 4px;\n  }\n  .mod-btn.active .count{ opacity:.55; }\n\n  /* chapter selector */\n  .nav-label{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 10.5px;\n    letter-spacing: 1.5px;\n    color: var(--muted-2);\n    margin-bottom: 8px;\n  }\n\n  .chapters{\n    display:flex;\n    gap: 10px;\n    margin-bottom: 20px;\n  }\n\n  .chap-btn{\n    flex: 1;\n    background: var(--panel);\n    border: 1px solid var(--line);\n    color: var(--muted);\n    font-family: 'IBM Plex Mono', monospace;\n    font-size: 14px;\n    font-weight: 600;\n    padding: 12px 14px;\n    border-radius: 8px;\n    cursor: pointer;\n    transition: border-color .15s ease, color .15s ease, background .15s ease;\n  }\n  .chap-btn:hover{ border-color: var(--cyan-dim); color: var(--text); }\n  .chap-btn.active{\n    background: var(--cyan);\n    border-color: var(--cyan);\n    color: var(--bg);\n  }\n  .chap-btn .count{ opacity:.6; font-weight:500; margin-left:6px; font-size: 12px; }\n\n  /* front-side mode toggle */\n  .mode-row{\n    display:flex;\n    align-items:center;\n    gap: 10px;\n    margin-bottom: 22px;\n  }\n\n  .mode-label{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 12px;\n    color: var(--muted-2);\n  }\n\n  .mode-toggle{\n    display:inline-flex;\n    background: var(--panel);\n    border: 1px solid var(--line);\n    border-radius: 8px;\n    padding: 3px;\n    gap: 3px;\n  }\n\n  .mode-opt{\n    background: transparent;\n    border: none;\n    color: var(--muted);\n    font-family: 'IBM Plex Mono', monospace;\n    font-size: 12px;\n    padding: 6px 12px;\n    border-radius: 6px;\n    cursor: pointer;\n    transition: background .15s ease, color .15s ease;\n  }\n\n  .mode-opt:hover{ color: var(--text); }\n\n  .mode-opt.active{\n    background: var(--cyan);\n    color: var(--bg);\n    font-weight: 600;\n  }\n\n  /* card area */\n  .stage{\n    display:flex;\n    flex-direction: column;\n    align-items: center;\n    gap: 18px;\n  }\n\n  .progress-row{\n    width: 100%;\n    display:flex;\n    align-items:center;\n    gap: 12px;\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 12px;\n    color: var(--muted-2);\n  }\n\n  .progress-track{\n    flex:1;\n    height: 4px;\n    background: var(--line-soft);\n    border-radius: 4px;\n    overflow: hidden;\n  }\n  .progress-fill{\n    height:100%;\n    background: linear-gradient(90deg, var(--cyan-dim), var(--cyan));\n    width: 0%;\n    transition: width .25s ease;\n  }\n\n  .card-scene{\n    width: 100%;\n    max-width: 640px;\n    perspective: 1400px;\n  }\n\n  .card{\n    position: relative;\n    width: 100%;\n    min-height: 260px;\n    cursor: pointer;\n    transform-style: preserve-3d;\n    transition: transform .45s cubic-bezier(.4,.2,.2,1);\n  }\n\n  .card.flipped{ transform: rotateY(180deg); }\n\n  .face{\n    position:absolute;\n    inset:0;\n    backface-visibility: hidden;\n    border-radius: 12px;\n    border: 1px solid var(--line);\n    padding: 34px 32px;\n    display:flex;\n    flex-direction:column;\n    justify-content:center;\n    align-items:center;\n    text-align:center;\n    gap: 14px;\n  }\n\n  .face-front{\n    background: var(--panel);\n    box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset, 0 18px 40px -20px rgba(0,0,0,.6);\n  }\n\n  .face-back{\n    background: var(--card-back);\n    transform: rotateY(180deg);\n    border-color: var(--cyan-dim);\n  }\n\n  .face-label{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 10.5px;\n    letter-spacing: 1.5px;\n    color: var(--muted-2);\n  }\n\n  .term{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: clamp(19px, 3.4vw, 26px);\n    font-weight: 600;\n    color: var(--cyan);\n    line-height: 1.35;\n  }\n\n  .definition{\n    font-size: 16.5px;\n    line-height: 1.55;\n    color: var(--text);\n    max-width: 480px;\n  }\n\n  .hint{\n    position:absolute;\n    bottom: 14px;\n    font-size: 11px;\n    color: var(--muted-2);\n    font-family:'IBM Plex Mono', monospace;\n  }\n\n  .controls{\n    display:flex;\n    align-items:center;\n    gap: 10px;\n    margin-top: 4px;\n  }\n\n  .ctrl-btn{\n    background: var(--panel);\n    border: 1px solid var(--line);\n    color: var(--text);\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 13px;\n    padding: 10px 16px;\n    border-radius: 8px;\n    cursor: pointer;\n    display:flex;\n    align-items:center;\n    gap: 6px;\n    transition: border-color .15s ease, transform .1s ease;\n  }\n\n  .ctrl-btn:hover{ border-color: var(--cyan-dim); }\n  .ctrl-btn:active{ transform: scale(0.97); }\n\n  .ctrl-btn.primary{\n    background: var(--cyan);\n    color: var(--bg);\n    border-color: var(--cyan);\n    font-weight: 600;\n  }\n  .ctrl-btn.primary:hover{ opacity: .9; }\n\n  .ctrl-btn.ghost{ color: var(--muted); }\n\n  .ctrl-btn svg{ width: 14px; height:14px; }\n\n  .kbd-hint{\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 11px;\n    color: var(--muted-2);\n    margin-top: 2px;\n  }\n  .kbd-hint kbd{\n    border: 1px solid var(--line);\n    border-radius: 4px;\n    padding: 1px 5px;\n    font-family: inherit;\n    color: var(--muted);\n  }\n\n  footer{\n    text-align:center;\n    margin-top: 44px;\n    font-family:'IBM Plex Mono', monospace;\n    font-size: 11.5px;\n    color: var(--muted-2);\n  }\n\n  @media (max-width: 520px){\n    .face{ padding: 26px 20px; }\n    header{ flex-direction: column; align-items:flex-start; }\n    .stat{ text-align:left; }\n  }\n\n  @media (prefers-reduced-motion: reduce){\n    .card, .progress-fill{ transition: none; }\n  }\n<\/style>\n<\/head>\n<body>\n\n<div class=\"wrap\">\n\n  <header>\n    <div>\n      <div class=\"brand\"><span class=\"dot\"><\/span><h1>ISR Chapters 1 &amp; 2 — Flashcards<\/h1><\/div>\n      <div class=\"subtitle\">capstone chapter 1 · RRL · RRS · sources · synthesis<\/div>\n    <\/div>\n    <div class=\"stat\">\n      <div><b id=\"totalCount\">0<\/b> terms loaded<\/div>\n      <div id=\"moduleLabel\">Chapter 1 · All<\/div>\n    <\/div>\n  <\/header>\n\n  <div class=\"nav-label\">CHAPTER<\/div>\n  <div class=\"chapters\" id=\"chapterTabs\"><\/div>\n  <div class=\"nav-label\">CATEGORY<\/div>\n  <div class=\"modules\" id=\"moduleTabs\"><\/div>\n\n  <div class=\"mode-row\">\n    <span class=\"mode-label\">Show first:<\/span>\n    <div class=\"mode-toggle\" id=\"modeToggle\">\n      <button class=\"mode-opt active\" data-mode=\"term\">Term<\/button>\n      <button class=\"mode-opt\" data-mode=\"def\">Definition<\/button>\n    <\/div>\n  <\/div>\n\n  <div class=\"stage\">\n    <div class=\"progress-row\">\n      <span id=\"cardPos\">1 / 10<\/span>\n      <div class=\"progress-track\"><div class=\"progress-fill\" id=\"progressFill\"><\/div><\/div>\n      <span id=\"flipState\">tap to flip<\/span>\n    <\/div>\n\n    <div class=\"card-scene\">\n      <div class=\"card\" id=\"card\">\n        <div class=\"face face-front\">\n          <span class=\"face-label\" id=\"frontLabel\">TERM<\/span>\n          <div class=\"term\" id=\"frontText\"><\/div>\n          <span class=\"hint\">click card / press space<\/span>\n        <\/div>\n        <div class=\"face face-back\">\n          <span class=\"face-label\" id=\"backLabel\" style=\"color:var(--cyan)\">DEFINITION<\/span>\n          <div class=\"definition\" id=\"backText\"><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"controls\">\n      <button class=\"ctrl-btn ghost\" id=\"prevBtn\" title=\"Previous (←)\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M15 18l-6-6 6-6\"/><\/svg>\n        Prev\n      <\/button>\n      <button class=\"ctrl-btn primary\" id=\"flipBtn\">Flip card<\/button>\n      <button class=\"ctrl-btn ghost\" id=\"nextBtn\" title=\"Next (→)\">\n        Next\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M9 18l6-6-6
