<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Martini's Cards</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8D%B8%3C/text%3E%3C/svg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #10150f;
    --panel: #172017;
    --panel-2: #1d291d;
    --line: #2d3f2c;
    --line-soft: #1f2d1f;
    --text: #eef3e6;
    --muted: #a2b494;
    --muted-2: #6b7f5f;
    --olive: #c9dc72;
    --olive-dim: #6f7f2f;
    --danger: #ff8080;
    --danger-dim: #7a2f2f;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100%;
  }

  body{
    min-height: 100vh;
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size: 48px 48px;
    background-position: -1px -1px;
    background-attachment: fixed;
  }
  body.modal-open{ overflow: hidden; }

  .wrap{
    max-width: 960px;
    margin: 0 auto;
    padding: 36px 20px 70px;
    padding-top: calc(36px + env(safe-area-inset-top, 0px));
  }

  /* Header */
  header{
    display:flex;
    align-items:center;
    gap: 16px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 26px;
  }
  .logo{ width: 52px; height: 52px; color: var(--text); flex: none; }
  h1{
    font-family:'IBM Plex Mono', monospace;
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: .2px;
  }
  h1 span{ color: var(--olive); }
  .tagline{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--muted);
  }

  /* Toolbar */
  .toolbar{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .count{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--muted);
  }
  .count b{ color: var(--olive); font-weight: 600; }

  .toolbar-btns{
    display: flex;
    gap: 8px;
  }

  .btn{
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: border-color .15s ease, transform .1s ease, opacity .15s ease;
  }
  .btn:hover{ border-color: var(--olive-dim); }
  .btn:active{ transform: scale(.97); }
  .btn.primary{
    background: var(--olive);
    border-color: var(--olive);
    color: var(--bg);
    font-weight: 600;
  }
  .btn.primary:hover{ opacity: .9; }

  /* Drop Zone */
  .drop{
    border: 1.5px dashed var(--line);
    border-radius: 12px;
    padding: 18px;
    text-align: center;
    color: var(--muted-2);
    font-family:'IBM Plex Mono', monospace;
    font-size: 12.5px;
    cursor: pointer;
    margin-bottom: 26px;
    display: block;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .drop:hover, .drop.over{
    border-color: var(--olive);
    color: var(--olive);
    background: rgba(201,220,114,.05);
  }

  /* Shelf Grid */
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }

  .tile{
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px 18px 16px;
    overflow: hidden;
    display:flex;
    flex-direction: column;
    gap: 8px;
    transition: border-color .15s ease, transform .15s ease, opacity .25s ease;
  }
  .tile:hover{ border-color: var(--c, var(--olive)); }
  .tile::before{
    content:"";
    position:absolute;
    left:0; top:0; right:0;
    height: 4px;
    background: var(--c, var(--olive));
  }
  .tile.gone{ opacity: 0; transform: scale(.96); }

  .tile h3{
    font-family:'IBM Plex Mono', monospace;
    font-size: 16px;
    font-weight: 600;
    color: var(--c, var(--olive));
    margin: 4px 0 0;
    line-height: 1.35;
    word-break: break-word;
  }
  .meta{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--muted-2);
    flex: 1;
  }
  .actions{
    display:flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }
  .actions .btn{ padding: 6px 10px; font-size: 11.5px; }
  .actions .open{
    flex: 1 1 100%;
    background: var(--c, var(--olive));
    border-color: var(--c, var(--olive));
    color: #10150f;
    font-weight: 600;
    text-align: center;
    margin-bottom: 2px;
  }
  .actions .sub-btn{ flex: 1; text-align: center; }
  .actions .del{ color: var(--muted); }
  .actions .del:hover{ border-color: var(--danger-dim); color: var(--danger); }

  .empty{
    grid-column: 1 / -1;
    text-align:center;
    padding: 44px 16px;
    color: var(--muted-2);
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
  }

  footer{
    margin-top: 40px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--muted-2);
    line-height: 1.7;
    text-align:center;
  }
  footer button{
    background:none; border:none; padding:0;
    color: var(--muted);
    font: inherit;
    text-decoration: underline;
    cursor:pointer;
  }
  footer button:hover{ color: var(--olive); }

  .notice{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--danger);
    border: 1px solid var(--danger-dim);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 16px;
  }

  /* Trash Modal & Reader Drawer */
  .modal-overlay{
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(16, 21, 15, 0.85);
    backdrop-filter: blur(4px);
    display:flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay[hidden]{ display:none; }

  .trash-card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    width: 100%;
    max-width: 600px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .trash-header{
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family:'IBM Plex Mono', monospace;
  }
  .trash-header h2{ margin: 0; font-size: 16px; color: var(--olive); }
  .trash-list{
    padding: 16px 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .trash-item{
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 14px;
    gap: 12px;
  }
  .trash-title{ font-family:'IBM Plex Mono', monospace; font-size: 13px; flex: 1; word-break: break-word; }
  .trash-actions{ display: flex; gap: 6px; }

  .reader{
    position: fixed;
    inset: 0;
    z-index: 50;
    background: var(--bg);
    display:flex;
    flex-direction: column;
  }
  .reader[hidden]{ display:none; }
  .reader-bar{
    display:flex;
    align-items:center;
    gap: 14px;
    padding: 10px 14px;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .reader-bar .btn{ padding: 7px 12px; font-size: 12.5px; }
  .reader-title{
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .reader iframe{
    flex: 1;
    width: 100%;
    border: 0;
    background: var(--bg);
  }

  /* Toast Notification */
  .toast{
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(20px);
    background: var(--panel-2);
    border: 1px solid var(--olive-dim);
    color: var(--text);
    font-family:'IBM Plex Mono', monospace;
    font-size: 12.5px;
    padding: 10px 16px;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 60;
    max-width: 90vw;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 520px){
    h1{ font-size: 22px; }
    .logo{ width: 42px; height: 42px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <svg class="logo" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15 17h34L32 33z" fill="rgba(201,220,114,.22)" stroke="none"/>
      <path d="M10 12h44L32 36z"/>
      <path d="M32 36v18M21 55h22"/>
      <path d="M47 5L35 28" stroke="#6f7f2f"/>
      <circle cx="38.5" cy="22" r="4.5" fill="#c9dc72" stroke="none"/>
    </svg>
    <div>
      <h1>Martini's <span>Cards</span></h1>
      <div class="tagline">your exam reviewers, all on one shelf</div>
    </div>
  </header>

  <div id="notice" class="notice" hidden></div>

  <div class="toolbar">
    <div class="count"><b id="countNum">0</b> <span id="countLabel">reviewers</span> on the shelf</div>
    <div class="toolbar-btns">
      <button class="btn" id="trashBtn">🗑️ Trash (<span id="trashCount">0</span>)</button>
      <button class="btn primary" id="addBtn">+ Add reviewer</button>
    </div>
  </div>

  <label class="drop" id="drop" for="fileInput">
    Drop reviewer .html files here, or click to browse
  </label>
  <input type="file" id="fileInput" accept=".html,.htm,text/html" multiple hidden>

  <div class="grid" id="grid"></div>

  <footer>
    Reviewers are saved in your local browser storage. &nbsp;·&nbsp; <button id="restoreBtn">Restore sample reviewers</button>
  </footer>
</div>

<!-- Trash Modal -->
<div class="modal-overlay" id="trashModal" hidden>
  <div class="trash-card">
    <div class="trash-header">
      <h2>Trash Bin</h2>
      <button class="btn" id="closeTrashBtn">Close</button>
    </div>
    <div class="trash-list" id="trashList"></div>
  </div>
</div>

<!-- Fullscreen Reader -->
<div class="reader" id="reader" hidden>
  <div class="reader-bar">
    <button class="btn" id="backBtn">← Back to shelf</button>
    <div class="reader-title" id="readerTitle"></div>
  </div>
  <iframe id="frame" sandbox="allow-scripts" title="Reviewer"></iframe>
</div>

<div class="toast" id="toast"></div>

<script>
/* Built-in Sample Reviewer Flashcard Sets */
const SAMPLE_REVIEWER_HTML = `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Networking Basics Flashcards</title>
<style>
  body{ background:#10150f; color:#eef3e6; font-family:monospace; padding:30px; text-align:center; }
  .card{ border:1px solid #6f7f2f; background:#172017; padding:40px; border-radius:12px; max-width:500px; margin:20px auto; cursor:pointer; }
  .term{ color:#c9dc72; font-size:22px; font-weight:bold; }
  .def{ font-size:16px; margin-top:15px; color:#a2b494; }
</style>
</head>
<body>
  <h2>Networking &amp; Protocols</h2>
  <div class="card" onclick="this.querySelector('.def').style.display = this.querySelector('.def').style.display==='none'?'block':'none'">
    <div class="term">DHCP</div>
    <div class="def">Dynamic Host Configuration Protocol - automatically assigns IP addresses and configuration parameters to network devices.</div>
  </div>
  <div class="card" onclick="this.querySelector('.def').style.display = this.querySelector('.def').style.display==='none'?'block':'none'">
    <div class="term">MAC Address</div>
    <div class="def">Media Access Control address - unique hardware identifier assigned to a network interface card (NIC).</div>
  </div>
  <p style="color:#6b7f5f;">(Click cards to reveal definition)</p>
  <script>
    const DATA = [{"terms":[["DHCP","Dynamic Host Configuration Protocol"],["MAC Address","Media Access Control address"]]}];
  <\/script>
</body>
</html>`;

const SEED = [
  { id: 'sample-net1', title: 'Networking & Protocols', html: SAMPLE_REVIEWER_HTML }
];

/* IndexedDB Storage Engine */
let db = null;
let mem = [];
let memTrash = [];
const memMeta = {};

function openDB(){
  return new Promise((resolve, reject) => {
    try{
      const r = indexedDB.open('martinis-cards', 2);
      r.onupgradeneeded = () => {
        const d = r.result;
        if(!d.objectStoreNames.contains('reviewers')) d.createObjectStore('reviewers', { keyPath: 'id' });
        if(!d.objectStoreNames.contains('trash')) d.createObjectStore('trash', { keyPath: 'id' });
        if(!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'k' });
      };
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    }catch(e){ reject(e); }
  });
}
const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const store = (n, m = 'readonly') => db.transaction(n, m).objectStore(n);

async function getAll(){ return db ? reqP(store('reviewers').getAll()) : mem.slice(); }
async function getTrashAll(){ return db ? reqP(store('trash').getAll()) : memTrash.slice(); }

async function put(rec){
  if(!db){ mem = mem.filter(x => x.id !== rec.id); mem.push(rec); return; }
  return reqP(store('reviewers', 'readwrite').put(rec));
}

async function moveToTrash(id){
  if(!db){
    const item = mem.find(x => x.id === id);
    if(item){ mem = mem.filter(x => x.id !== id); memTrash.push(item); }
    return;
  }
  const item = await reqP(store('reviewers').get(id));
  if(item){
    await reqP(store('reviewers', 'readwrite').delete(id));
    await reqP(store('trash', 'readwrite').put(item));
  }
}

async function restoreFromTrash(id){
  if(!db){
    const item = memTrash.find(x => x.id === id);
    if(item){ memTrash = memTrash.filter(x => x.id !== id); mem.push(item); }
    return;
  }
  const item = await reqP(store('trash').get(id));
  if(item){
    await reqP(store('trash', 'readwrite').delete(id));
    await reqP(store('reviewers', 'readwrite').put(item));
  }
}

async function delPermanently(id){
  if(!db){ memTrash = memTrash.filter(x => x.id !== id); return; }
  return reqP(store('trash', 'readwrite').delete(id));
}

async function getMeta(k){
  if(!db) return memMeta[k];
  const r = await reqP(store('meta').get(k));
  return r ? r.v : undefined;
}
async function setMeta(k, v){
  if(!db){ memMeta[k] = v; return; }
  return reqP(store('meta', 'readwrite').put({ k, v }));
}

/* Reviewer Parsing & Meta Extraction */
function countCards(html){
  const i = html.indexOf('const DATA = ');
  if(i < 0) return null;
  const j = html.indexOf('[', i);
  let depth = 0, inStr = false, esc = false, k = j;
  for(; k < html.length; k++){
    const ch = html[k];
    if(inStr){
      if(esc) esc = false;
      else if(ch === '\\') esc = true;
      else if(ch === '"') inStr = false;
      continue;
    }
    if(ch === '"') inStr = true;
    else if(ch === '[') depth++;
    else if(ch === ']') { depth--; if(depth === 0) break; }
  }
  try{
    const data = JSON.parse(html.slice(j, k + 1));
    let n = 0;
    data.forEach(item => {
      if(item.terms) n += item.terms.length;
      if(item.sections) item.sections.forEach(s => { n += (s.terms || []).length; });
    });
    return n;
  }catch(e){ return null; }
}

function extractMeta(html, fallbackName){
  let title = fallbackName;
  const t = html.match(/<title>([\s\S]*?)<\/title>/i);
  if(t){
    title = t[1].replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').trim();
  }
  title = title.replace(/\s*[—-]\s*(Flashcard Reviewer|Flashcards)\s*$/i, '') || fallbackName;
  const c = html.match(/--cyan:\s*(#[0-9a-fA-F]{3,8})/);
  const color = c ? c[1] : '#c9dc72';
  let cards = countCards(html);
  return { title, color, cards };
}

/* UI Logic */
const grid = document.getElementById('grid');
const countNum = document.getElementById('countNum');
const countLabel = document.getElementById('countLabel');
const trashCount = document.getElementById('trashCount');
const toastEl = document.getElementById('toast');
let toastTimer = null;

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
}

function fmtDate(ts){
  return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

async function refresh(){
  const list = (await getAll()).sort((a, b) => b.added - a.added);
  const trashList = await getTrashAll();
  
  grid.innerHTML = '';
  countNum.textContent = list.length;
  countLabel.textContent = list.length === 1 ? 'reviewer' : 'reviewers';
  trashCount.textContent = trashList.length;

  if(!list.length){
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = 'The shelf is empty. Add a reviewer to get started.';
    grid.appendChild(e);
    return;
  }

  list.forEach(rec => {
    const tile = document.createElement('article');
    tile.className = 'tile';
    tile.style.setProperty('--c', rec.color || '#c9dc72');

    const h = document.createElement('h3');
    h.textContent = rec.title;

    const meta = document.createElement('div');
    meta.className = 'meta';
    const bits = [];
    if(rec.cards != null) bits.push(rec.cards + ' cards');
    bits.push(rec.builtin ? 'sample' : 'added ' + fmtDate(rec.added));
    meta.textContent = bits.join(' · ');

    const actions = document.createElement('div');
    actions.className = 'actions';

    const open = document.createElement('button');
    open.className = 'btn open';
    open.textContent = 'Open';
    open.addEventListener('click', () => openReader(rec));

    const renameBtn = document.createElement('button');
    renameBtn.className = 'btn sub-btn';
    renameBtn.textContent = 'Rename';
    renameBtn.addEventListener('click', async () => {
      const newTitle = prompt('Enter new title for this reviewer:', rec.title);
      if(newTitle && newTitle.trim()){
        rec.title = newTitle.trim();
        await put(rec);
        await refresh();
        toast('Renamed to ' + rec.title);
      }
    });

    const dlBtn = document.createElement('button');
    dlBtn.className = 'btn sub-btn';
    dlBtn.textContent = 'Download';
    dlBtn.addEventListener('click', () => {
      const blob = new Blob([rec.html], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = rec.title.replace(/[^a-z0-9_\-]/gi, '_') + '.html';
      a.click();
      URL.revokeObjectURL(a.href);
      toast('Downloaded ' + rec.title);
    });

    const delBtn = document.createElement('button');
    delBtn.className = 'btn sub-btn del';
    delBtn.textContent = 'Delete';
    delBtn.addEventListener('click', async () => {
      tile.classList.add('gone');
      await moveToTrash(rec.id);
      setTimeout(refresh, 250);
      toast('Moved ' + rec.title + ' to Trash');
    });

    actions.append(open, renameBtn, dlBtn, delBtn);
    tile.append(h, meta, actions);
    grid.appendChild(tile);
  });
}

/* Trash Bin Modal */
const trashModal = document.getElementById('trashModal');
const trashListEl = document.getElementById('trashList');

async function openTrash(){
  const list = await getTrashAll();
  trashListEl.innerHTML = '';
  if(!list.length){
    trashListEl.innerHTML = '<div style="color:var(--muted); font-family:monospace; text-align:center; padding:20px;">Trash bin is empty.</div>';
  } else {
    list.forEach(item => {
      const row = document.createElement('div');
      row.className = 'trash-item';
      
      const title = document.createElement('div');
      title.className = 'trash-title';
      title.textContent = item.title;

      const act = document.createElement('div');
      act.className = 'trash-actions';

      const res = document.createElement('button');
      res.className = 'btn';
      res.textContent = 'Restore';
      res.addEventListener('click', async () => {
        await restoreFromTrash(item.id);
        await openTrash();
        await refresh();
        toast('Restored ' + item.title);
      });

      const del = document.createElement('button');
      del.className = 'btn del';
      del.textContent = 'Delete Forever';
      del.addEventListener('click', async () => {
        await delPermanently(item.id);
        await openTrash();
        await refresh();
        toast('Permanently deleted');
      });

      act.append(res, del);
      row.append(title, act);
      trashListEl.appendChild(row);
    });
  }
  trashModal.hidden = false;
  document.body.classList.add('modal-open');
}

document.getElementById('trashBtn').addEventListener('click', openTrash);
document.getElementById('closeTrashBtn').addEventListener('click', () => {
  trashModal.hidden = true;
  document.body.classList.remove('modal-open');
});

/* Fullscreen Reader */
const reader = document.getElementById('reader');
const frame = document.getElementById('frame');
const readerTitle = document.getElementById('readerTitle');

function openReader(rec){
  readerTitle.textContent = rec.title;
  frame.addEventListener('load', () => { try{ frame.focus(); }catch(e){} }, { once: true });
  frame.srcdoc = rec.html;
  reader.hidden = false;
  document.body.classList.add('modal-open');
}
function closeReader(){
  reader.hidden = true;
  frame.srcdoc = '';
  document.body.classList.remove('modal-open');
}
document.getElementById('backBtn').addEventListener('click', closeReader);

/* File Import (Browse / Drag & Drop) */
async function addFiles(files){
  let added = 0, skipped = 0;
  for(const f of files){
    if(!/\.html?$/i.test(f.name)){ skipped++; continue; }
    const text = await f.text();
    if(text.indexOf('<') < 0){ skipped++; continue; }
    const base = f.name.replace(/\.html?$/i, '').replace(/[_-]+/g, ' ');
    const m = extractMeta(text, base);
    await put({
      id: 'u' + Date.now() + Math.random().toString(36).slice(2, 7),
      title: m.title, html: text, color: m.color, cards: m.cards,
      added: Date.now(), builtin: false
    });
    added++;
  }
  await refresh();
  if(added) toast('Added ' + added + (added === 1 ? ' reviewer' : ' reviewers'));
  else if(skipped) toast('Only .html reviewer files can be added');
}

const fileInput = document.getElementById('fileInput');
document.getElementById('addBtn').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', async () => {
  await addFiles(Array.from(fileInput.files));
  fileInput.value = '';
});

const drop = document.getElementById('drop');
['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.add('over');
}));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault();
  if(ev === 'drop' || e.target === document.documentElement || e.relatedTarget === null) drop.classList.remove('over');
}));
document.addEventListener('drop', e => {
  if(e.dataTransfer && e.dataTransfer.files.length) addFiles(Array.from(e.dataTransfer.files));
});

/* Restore Sample Reviewers */
async function installSeeds(onlyMissing){
  const have = new Set((await getAll()).map(r => r.id));
  const now = Date.now();
  let n = 0;
  for(let i = 0; i < SEED.length; i++){
    const s = SEED[i];
    if(onlyMissing && have.has(s.id)) continue;
    const m = extractMeta(s.html, s.title);
    await put({
      id: s.id, title: s.title, html: s.html, color: m.color, cards: m.cards,
      added: now - i * 1000, builtin: true
    });
    n++;
  }
  return n;
}

document.getElementById('restoreBtn').addEventListener('click', async () => {
  const n = await installSeeds(true);
  await refresh();
  toast(n ? 'Restored ' + n + (n === 1 ? ' sample reviewer' : ' sample reviewers') : 'All sample reviewers are already on the shelf');
});

/* Initialization */
(async function init(){
  try{
    db = await openDB();
  }catch(e){
    db = null;
    const n = document.getElementById('notice');
    n.textContent = "Browser storage isn't available here, so changes won't be saved after you close this page.";
    n.hidden = false;
  }
  if(!(await getMeta('seeded'))){
    await installSeeds(false);
    await setMeta('seeded', true);
  }
  await refresh();
})();
</script>
